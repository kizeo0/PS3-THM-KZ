<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 THM KZ</title>
    <style>
        /* RESET TOTAL PARA AHORRAR RAM */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: Arial, sans-serif;
            line-height: 1.2;
            padding: 15px 0;
            text-align: center;
        }

        .main-container {
            width: 1400px; 
            margin: 0 auto;
            text-align: left;
        }

        .header {
            overflow: hidden;
            margin-bottom: 20px;
            border-bottom: 4px solid #ff6b35;
            padding-bottom: 15px;
        }

        .logo-img {
            height: 90px;
            float: left;
            cursor: pointer;
        }

        .social-container {
            float: right;
            background: #0a1a2a;
            padding: 8px 25px;
            border-radius: 50px;
            border: 2px solid #ff6b35;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            margin: 0 5px;
            vertical-align: middle;
        }

        .toolbar {
            background: #0a1a2a;
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            border-left: 5px solid #ff6b35;
            overflow: hidden;
        }

        .search-wrapper { float: left; }

        .search-wrapper input {
            width: 250px;
            padding: 12px 18px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 40px;
            color: white;
            vertical-align: middle;
        }

        .dice-btn {
            display: inline-block;
            width: 45px;
            height: 45px;
            margin-left: 8px;
            background: #1e3b4f;
            border: 2px solid #ff6b35;
            border-radius: 50%;
            text-align: center;
            line-height: 42px;
            cursor: pointer;
            vertical-align: middle;
        }

        .dice-img { width: 28px; vertical-align: middle; }

        .sort-buttons { float: left; margin-left: 20px; }

        .sort-btn {
            background: #1e3b4f;
            border: 2px solid #1e3b4f;
            color: #c9d9e8;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 5px;
        }

        .sort-btn.active { background: #ff6b35; color: #0b0f17; border-color: #ff6b35; }

        .btn-genre-active {
            background: #0b0f17;
            border-color: #ffb28c;
            color: #ffb28c;
            display: none;
        }

        .btn-adult { border-color: #ff3535; color: #ff9b9b; }
        .btn-adult.active { background: #ff3535; color: white; }

        .stats { float: right; color: #9ab8d9; line-height: 45px; font-weight: bold; }

        .grid { text-align: center; clear: both; }

        .theme-card {
            width: 300px;
            background: #0e1727;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #1f3a4c;
            display: inline-block;
            vertical-align: top;
            margin: 12px;
            text-align: left;
        }

        .preview {
            width: 100%;
            background: #000;
            text-align: center;
            border-bottom: 2px solid #ff6b35;
            height: 220px;
            line-height: 220px;
            overflow: hidden;
        }

        .preview img { max-width: 100%; max-height: 100%; vertical-align: middle; }

        .card-info { padding: 15px; }

        .theme-name {
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            height: 38px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        /* --- ESTILO DE GÉNERO MEJORADO --- */
        .theme-genre {
            background: #1e3b4f; /* Color un poco más claro para resaltar */
            padding: 6px 14px;
            border-radius: 8px; /* Menos redondo para un look más moderno */
            font-size: 13px;
            font-weight: bold;
            color: #ffb28c;
            margin-bottom: 12px;
            display: inline-block;
            border: 2px solid #ff6b35; /* Borde sólido naranja */
            cursor: pointer;
            text-transform: uppercase; /* En mayúsculas para mayor impacto */
            letter-spacing: 0.5px;
        }

        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            border-radius: 30px;
            text-align: center;
            display: block;
            font-size: 14px;
        }

        .load-more { text-align: center; margin: 20px 0; }

        .btn-primary {
            background: #ff6b35;
            color: #0b0f17;
            padding: 15px 50px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .footer {
            margin-top: 40px;
            border-top: 2px solid #ff6b3540;
            padding: 20px 0;
            color: #b0c8e0;
        }

        .clearfix::after { content: ""; display: table; clear: both; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header clearfix">
        <img src="recursos/titulo.png" alt="Logo" class="logo-img" onclick="volverInicio()">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos"><img src="recursos/yt.png" class="social-icon"></a>
            <a href="https://github.com/kizeo0"><img src="recursos/git.png" class="social-icon"></a>
            <a href="https://x.com/KiZeo0"><img src="recursos/x.png" class="social-icon"></a>
        </div>
    </div>

    <div class="toolbar clearfix">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Escribe para buscar..." onkeyup="buscarConRetraso()">
            <div class="dice-btn" onclick="modoAleatorio()">
                <img src="recursos/dado.png" class="dice-img">
            </div>
        </div>
        <div class="sort-buttons">
            <button class="sort-btn" id="sortAZ" onclick="ordenarAZ()">A-Z</button>
            <button class="sort-btn" id="sortZA" onclick="ordenarZA()">Z-A</button>
            <button class="sort-btn btn-adult" id="adultBtn" onclick="toggleAdulto()">+18 OFF</button>
            <button class="sort-btn btn-genre-active" id="genreActiveBtn" onclick="volverInicio()"></button>
        </div>
        <div class="stats" id="stats">...</div>
    </div>

    <div id="themeGrid" class="grid">
        <div style="padding:40px; color:#ffb28c;">Cargando base de datos...</div>
    </div>

    <div class="load-more" id="loadMoreContainer" style="display: none;">
        <button class="btn-primary" onclick="cargarMas()">Ver más temas</button>
    </div>

    <div class="footer clearfix">
        <span style="float:left">© PS3 · Temas P3T</span>
        <span style="float:right">kizeo0</span>
    </div>
</div>

<script>
    var JSON_URL = 'temas_ps3_conlinks.json';
    var PAGE_SIZE = 12; 
    var PALABRAS_ADULTO = ['adult', '18+', 'girls/adult', 'girl', 'sexy', 'ecchi', 'hentai', 'babes', 'harem'];
    var PREVIEW_FOLDERS = [
        'previews1/', 'previews2/', 
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud/main/previews3/',
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud1/main/previews4/'
    ];

    var allThemes = [];
    var filteredThemes = [];
    var currentSort = 'none';
    var currentPage = 0;
    var currentGenre = '';
    var mostrarContenidoAdulto = false;
    var searchTimer = null; 

    var grid = document.getElementById('themeGrid');
    var statsDiv = document.getElementById('stats');
    var loadMoreContainer = document.getElementById('loadMoreContainer');
    var searchInput = document.getElementById('searchInput');
    var adultBtn = document.getElementById('adultBtn');
    var genreActiveBtn = document.getElementById('genreActiveBtn');

    var xhr = new XMLHttpRequest();
    xhr.open('GET', JSON_URL, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
            try {
                var data = (window.JSON && window.JSON.parse) ? JSON.parse(xhr.responseText) : eval('(' + xhr.responseText + ')');
                allThemes = [];
                for (var i = 0; i < data.length; i++) {
                    var item = data[i];
                    allThemes.push({
                        archivo: item.archivo,
                        descarga: item.descarga,
                        genero: item.genero || 'Otro',
                        nombre: item.archivo.replace(/\.p3t$/i, ''),
                        preview_idx: item.preview_idx || 0
                    });
                }
                aplicarFiltros();
            } catch(e) { grid.innerHTML = 'Error de datos.'; }
        }
    };
    xhr.send();

    window.buscarConRetraso = function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
            currentGenre = '';
            aplicarFiltros();
        }, 500);
    };

    window.toggleAdulto = function() {
        mostrarContenidoAdulto = !mostrarContenidoAdulto;
        adultBtn.innerHTML = mostrarContenidoAdulto ? "+18 ON" : "+18 OFF";
        adultBtn.className = mostrarContenidoAdulto ? "sort-btn btn-adult active" : "sort-btn btn-adult";
        aplicarFiltros();
    };

    function aplicarFiltros() {
        var query = searchInput.value.toLowerCase();
        filteredThemes = [];
        
        genreActiveBtn.style.display = (currentGenre !== '') ? 'inline-block' : 'none';
        if(currentGenre !== '') genreActiveBtn.innerHTML = currentGenre.toUpperCase() + " X";

        for (var i = 0; i < allThemes.length; i++) {
            var t = allThemes[i];
            var gen = t.genero.toLowerCase();

            var isAdult = false;
            for(var j=0; j<PALABRAS_ADULTO.length; j++) {
                if(gen.indexOf(PALABRAS_ADULTO[j]) !== -1) { isAdult = true; break; }
            }
            if(!mostrarContenidoAdulto && isAdult) continue;

            if(t.nombre.toLowerCase().indexOf(query) !== -1 && (currentGenre === '' || gen === currentGenre.toLowerCase())) {
                filteredThemes.push(t);
            }
        }

        if(currentSort === 'az') filteredThemes.sort(function(a,b){ return a.nombre < b.nombre ? -1 : 1; });
        if(currentSort === 'za') filteredThemes.sort(function(a,b){ return a.nombre > b.nombre ? -1 : 1; });

        currentPage = 0;
        render(true);
    }

    function render(reset) {
        if (reset) {
            var imgs = grid.getElementsByTagName('img');
            for(var i=0; i<imgs.length; i++) imgs[i].src = '';
            grid.innerHTML = '';
        }

        var start = currentPage * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, filteredThemes.length);

        for (var i = start; i < end; i++) {
            var t = filteredThemes[i];
            var imgName = encodeURI(t.nombre + '.png').replace(/'/g, "%27").replace(/&/g, "%26");
            var folder = PREVIEW_FOLDERS[t.preview_idx] || PREVIEW_FOLDERS[0];
            var nombreDisp = t.nombre.replace(/\(nombre igual\)/gi, "").replace(/pkg/gi, "");

            var card = document.createElement('div');
            card.className = 'theme-card';
            card.innerHTML = 
                '<div class="preview"><img src="' + folder + imgName + '" onerror="proximaCarpeta(this,'+t.preview_idx+',\''+imgName+'\')"></div>' +
                '<div class="card-info">' +
                    '<div class="theme-name">' + nombreDisp + '</div>' +
                    '<div class="theme-genre" onclick="filtrarPorGenero(\''+t.genero+'\')">' + t.genero + '</div>' +
                    '<a href="' + t.descarga + '" class="download-btn">DESCARGAR</a>' +
                '</div>';
            grid.appendChild(card);
        }

        statsDiv.innerHTML = filteredThemes.length + ' Temas';
        loadMoreContainer.style.display = (end < filteredThemes.length) ? 'block' : 'none';
    }

    window.proximaCarpeta = function(img, idx, name) {
        var nIdx = idx + 1;
        if(nIdx < PREVIEW_FOLDERS.length) {
            img.src = PREVIEW_FOLDERS[nIdx] + name;
            img.onerror = function() { proximaCarpeta(img, nIdx, name); };
        } else {
            img.style.display = 'none';
        }
    };

    window.filtrarPorGenero = function(g) { currentGenre = g; searchInput.value = ''; aplicarFiltros(); };
    window.volverInicio = function() { searchInput.value = ''; currentGenre = ''; currentSort = 'none'; aplicarFiltros(); };
    window.cargarMas = function() { currentPage++; render(false); };
    window.ordenarAZ = function() { currentSort = 'az'; aplicarFiltros(); };
    window.ordenarZA = function() { currentSort = 'za'; aplicarFiltros(); };
    window.modoAleatorio = function() {
        filteredThemes.sort(function() { return 0.5 - Math.random(); });
        currentPage = 0; render(true);
    };
</script>
</body>
</html>
