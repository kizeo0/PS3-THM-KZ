<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 THM KZ</title>
    <style>
        /* Estilos base para PS3 - Optimizados para NetFront */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: #0b0f17; color: #e0e5f0; font-family: Arial, sans-serif; line-height: 1.2; padding: 20px 0; text-align: center; }
        
        .main-container { width: 1750px; margin: 0 auto; text-align: left; } 

        .header { overflow: hidden; margin-bottom: 25px; border-bottom: 5px solid #ff6b35; padding-bottom: 20px; }
        .logo-img { height: 115px; float: left; cursor: pointer; }

        .social-container { float: right; background: #0a1a2a; padding: 10px 30px; border-radius: 60px; border: 3px solid #ff6b35; margin-top: 15px; }
        .social-icon { width: 62px; height: 62px; margin: 0 7px; vertical-align: middle; }

        .toolbar { background: #0a1a2a; padding: 20px; border-radius: 15px; margin-bottom: 30px; border: 2px solid #1e2a3a; display: block; overflow: hidden; }
        
        .search-box { width: 600px; height: 60px; background: #162435; border: 2px solid #ff6b35; border-radius: 10px; color: white; padding: 0 20px; font-size: 24px; float: left; }
        
        .nav-buttons { float: right; }
        .sort-btn { background: #162435; border: 2px solid #3d4b5c; color: #b0b8c4; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin-left: 10px; }
        .sort-btn:hover, .sort-btn.active { border-color: #ff6b35; color: white; background: #1e2a3a; }
        .btn-adult.active { background: #8b0000; border-color: #ff4d4d; color: white; }

        .genre-tag-active { display: none; background: #ff6b35; color: white; padding: 10px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .grid { display: block; overflow: hidden; }
        
        .theme-card { width: 410px; background: #162435; border-radius: 15px; border: 2px solid #1e2a3a; margin: 0 13px 25px 13px; float: left; transition: transform 0.2s; position: relative; }
        .theme-card:hover { border-color: #ff6b35; transform: translateY(-5px); }

        .preview { width: 100%; height: 230px; background: #0b0f17; border-radius: 13px 13px 0 0; overflow: hidden; display: table-cell; vertical-align: middle; text-align: center; }
        .preview img { max-width: 100%; max-height: 100%; display: inline-block; }

        .card-info { padding: 15px; }
        .theme-name { font-size: 20px; font-weight: bold; margin-bottom: 8px; color: white; height: 48px; overflow: hidden; }
        .theme-genre { font-size: 14px; color: #ff6b35; margin-bottom: 15px; text-transform: uppercase; cursor: pointer; display: inline-block; }
        
        .download-btn { display: block; width: 100%; background: #ff6b35; color: white; text-align: center; padding: 12px 0; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 18px; }
        .download-btn:hover { background: #ff8555; }

        .stats { margin-top: 20px; color: #6b7a8d; font-size: 16px; clear: both; padding: 20px 0; }

        .pagination { margin-top: 30px; padding-bottom: 50px; clear: both; }
        .page-box { display: inline-block; padding: 10px 20px; background: #162435; border: 2px solid #3d4b5c; border-radius: 8px; color: white; margin: 0 5px; cursor: pointer; font-weight: bold; }
        .page-box.active { border-color: #ff6b35; background: #ff6b35; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <img src="logo.png" class="logo-img" onclick="volverInicio()">
        <div class="social-container">
            <a href="#"><img src="youtube.png" class="social-icon"></a>
            <a href="#"><img src="twitter.png" class="social-icon"></a>
            <a href="#"><img src="discord.png" class="social-icon"></a>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar tema..." onkeyup="buscarConRetraso()">
        <div class="nav-buttons">
            <button class="sort-btn" onclick="modoAleatorio()">ALEATORIO</button>
            <button class="sort-btn btn-adult" id="adultBtn" onclick="toggleAdulto()">+18 OFF</button>
        </div>
    </div>

    <div id="genreActiveBtn" class="genre-tag-active" onclick="volverInicio()"></div>

    <div class="grid" id="themeGrid">
        </div>

    <div id="stats" class="stats">Cargando...</div>
    <div id="pagination" class="pagination"></div>
</div>

<script>
    var JSON_URL = 'temas_ps3_conlinks.json';
    var PAGE_SIZE = 12; 
    var PALABRAS_ADULTO = ['adult', '18+', 'girls/adult', 'sexy', 'ecchi', 'hentai', 'babes', 'harem', 'j-idols', 'j-idol', 'people','Girl','Girls'];
    
    var PREVIEW_FOLDERS = [
        'previews1/', 'previews2/', 
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud/main/previews3/',
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud1/main/previews4/',
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud2/main/previews5/'
    ];

    var allThemes = [];
    var filteredThemes = [];
    var currentPage = 0;
    var currentGenre = '';
    var mostrarContenidoAdulto = false;
    var esModoAleatorio = false; 
    var searchTimer = null; 

    var grid = document.getElementById('themeGrid');
    var statsDiv = document.getElementById('stats');
    var paginationDiv = document.getElementById('pagination');
    var searchInput = document.getElementById('searchInput');
    var adultBtn = document.getElementById('adultBtn');
    var genreActiveBtn = document.getElementById('genreActiveBtn');

    function cargarJSON() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', JSON_URL + '?v=' + new Date().getTime(), true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200 || xhr.status === 0) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        allThemes = [];
                        for (var i = 0; i < data.length; i++) {
                            var item = data[i];
                            allThemes.push({
                                archivo: item.archivo,
                                descarga: item.descarga,
                                genero: item.genero || 'Otro',
                                nombre: item.archivo.replace(/\.p3t$/i, ''),
                                preview_idx: item.preview_idx || 0
                            });
                        }
                        aplicarFiltros();
                    } catch(e) { grid.innerHTML = '<div style="color:red">Error al procesar JSON.</div>'; }
                }
            }
        };
        xhr.send();
    }

    cargarJSON();

    window.buscarConRetraso = function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
            currentGenre = '';
            currentPage = 0;
            esModoAleatorio = false; 
            aplicarFiltros();
        }, 600);
    };

    window.toggleAdulto = function() {
        mostrarContenidoAdulto = !mostrarContenidoAdulto;
        adultBtn.innerHTML = mostrarContenidoAdulto ? "+18 ON" : "+18 OFF";
        adultBtn.className = mostrarContenidoAdulto ? "sort-btn btn-adult active" : "sort-btn btn-adult";
        currentPage = 0;
        aplicarFiltros();
    };

    function aplicarFiltros() {
        var query = searchInput.value.toLowerCase();
        filteredThemes = [];
        
        if(currentGenre !== '') {
            genreActiveBtn.style.display = 'inline-block';
            genreActiveBtn.innerHTML = currentGenre + " X";
        } else {
            genreActiveBtn.style.display = 'none';
        }

        for (var i = 0; i < allThemes.length; i++) {
            var t = allThemes[i];
            var genNormalizado = t.genero.toLowerCase();
            var isAdult = false;
            for(var j=0; j<PALABRAS_ADULTO.length; j++) {
                if(genNormalizado.indexOf(PALABRAS_ADULTO[j].toLowerCase()) !== -1) { isAdult = true; break; }
            }
            if(!mostrarContenidoAdulto && isAdult) continue;

            if(t.nombre.toLowerCase().indexOf(query) !== -1 && (currentGenre === '' || genNormalizado === currentGenre.toLowerCase())) {
                filteredThemes.push(t);
            }
        }
        render();
    }

    function crearHTMLTarjeta(t, destacado) {
        // CORRECCIÓN CRÍTICA: Convertimos caracteres especiales como ' y © en códigos seguros para la URL.
        // Reemplazamos ' por %27 para que no rompa la función del atributo onerror.
        var imgNameSafe = encodeURIComponent(t.nombre + '.png').replace(/'/g, "%27");
        
        var folder = PREVIEW_FOLDERS[t.preview_idx] || PREVIEW_FOLDERS[0];
        var estiloExtra = destacado ? ' style="border-color: #ffb28c; box-shadow: 0 0 15px rgba(255,178,140,0.3);"' : '';
        
        return '<div class="theme-card"' + estiloExtra + '>' +
                '<div class="preview"><img src="' + folder + imgNameSafe + '" onerror="proximaCarpeta(this,'+t.preview_idx+',\''+imgNameSafe+'\')"></div>' +
                '<div class="card-info">' +
                    '<div class="theme-name">' + t.nombre.replace(/\(nombre igual\)/gi, "").replace(/pkg/gi, "") + '</div>' +
                    '<div class="theme-genre" onclick="filtrarPorGenero(\''+t.genero.replace(/'/g, "\\'")+'\')">' + t.genero + '</div>' +
                    '<a href="' + t.descarga + '" class="download-btn">DESCARGAR</a>' +
                '</div>' +
            '</div>';
    }

    function render() {
        grid.innerHTML = '';
        
        if (!esModoAleatorio && currentPage === 0 && currentGenre === '' && searchInput.value === '') {
            var pool = [];
            for(var a=0; a<allThemes.length; a++) if(allThemes[a].genero === 'AnimugenZ') pool.push(allThemes[a]);
            if(pool.length > 0) {
                pool.sort(function() { return 0.5 - Math.random(); });
                var dest = pool.slice(0, 2);
                for(var d=0; d<dest.length; d++) grid.innerHTML += crearHTMLTarjeta(dest[d], true);
            }
        }

        var start = currentPage * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, filteredThemes.length);
        for (var i = start; i < end; i++) grid.innerHTML += crearHTMLTarjeta(filteredThemes[i], false);

        statsDiv.innerHTML = filteredThemes.length + ' Temas';
        dibujarPaginacion();
    }

    function dibujarPaginacion() {
        var totalPages = Math.ceil(filteredThemes.length / PAGE_SIZE);
        paginationDiv.innerHTML = '';
        if(totalPages <= 1) return;

        var visibleButtons = 10;
        var half = Math.floor(visibleButtons / 2);
        var startPage = Math.max(0, currentPage - half);
        var endPage = Math.min(totalPages - 1, startPage + visibleButtons - 1);
        
        if (endPage - startPage < visibleButtons - 1) {
            startPage = Math.max(0, endPage - (visibleButtons - 1));
        }

        for (var p = startPage; p <= endPage; p++) {
            var btn = document.createElement('button');
            btn.className = (p === currentPage) ? 'page-box active' : 'page-box';
            btn.innerHTML = (p + 1);
            btn.onclick = (function(page) {
                return function() { currentPage = page; render(); window.scrollTo(0, 300); };
            })(p);
            paginationDiv.appendChild(btn);
        }
    }

    window.proximaCarpeta = function(img, idx, name) {
        var nIdx = idx + 1;
        if(nIdx < PREVIEW_FOLDERS.length) {
            img.src = PREVIEW_FOLDERS[nIdx] + name;
            img.onerror = function() { proximaCarpeta(img, nIdx, name); };
        } else { img.style.display = 'none'; }
    };

    window.filtrarPorGenero = function(g) { 
        currentGenre = g; 
        searchInput.value = ''; 
        currentPage = 0; 
        esModoAleatorio = false; 
        aplicarFiltros(); 
    };

    window.volverInicio = function() { 
        searchInput.value = ''; 
        currentGenre = ''; 
        currentPage = 0; 
        esModoAleatorio = false; 
        aplicarFiltros(); 
    };

    window.modoAleatorio = function() {
        esModoAleatorio = true; 
        filteredThemes.sort(function() { return 0.5 - Math.random(); });
        currentPage = 0; 
        render();
    };
</script>
</body>
</html>
