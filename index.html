<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 · temas p3t</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            line-height: 1.5;
            padding: 20px 0; /* Padding lateral quitado para centrar mejor */
            min-height: 100vh;
            text-align: center; /* Ayuda a centrar el contenedor principal */
        }

        /* Contenedor principal ajustado para 4 columnas en 720p/1080p */
        .main-container {
            width: 1260px;
            margin: 0 auto;
            text-align: left; /* Restaura la alineación de texto interna */
        }

        .header {
            overflow: hidden;
            margin-bottom: 25px;
            border-bottom: 2px solid #ff6b35;
            padding-bottom: 15px;
            margin-left: 20px;
            margin-right: 20px;
        }
        .logo-img {
            height: 65px;
            width: auto;
            max-width: 100%;
            filter: drop-shadow(0 0 6px #ff6b35);
            float: left;
        }
        .social-container {
            float: right;
            background: #0a1a2a;
            padding: 6px 20px;
            border-radius: 50px;
            border: 1px solid #ff6b35;
        }
        .social-icon {
            width: 44px;
            height: 44px;
            object-fit: contain;
            background: #0a1a2a;
            border-radius: 12px;
            padding: 4px;
            display: inline-block;
            vertical-align: middle;
        }
        
        .toolbar {
            background: #0a1a2a;
            padding: 16px 25px;
            border-radius: 60px;
            margin: 0 20px 30px 20px;
            border-left: 5px solid #ff6b35;
            box-shadow: 0 10px 20px #00000080;
            overflow: hidden;
        }
        .search-wrapper {
            float: left;
            white-space: nowrap;
        }
        .search-wrapper input {
            width: 250px;
            padding: 14px 18px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            outline: none;
            vertical-align: middle;
        }
        .dice-btn {
            display: inline-block;
            width: 52px;
            height: 52px;
            margin-left: 8px;
            background: #1e3b4f;
            border: 2px solid #ff6b35;
            border-radius: 50%;
            text-align: center;
            line-height: 52px;
            cursor: pointer;
            vertical-align: middle;
        }
        .dice-img {
            width: 32px;
            height: 32px;
            vertical-align: middle;
        }
        .sort-buttons {
            float: left;
            margin-left: 20px;
            white-space: nowrap;
        }
        .sort-btn {
            background: transparent;
            border: 2px solid #1e3b4f;
            color: #c9d9e8;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
        .sort-btn.active {
            background: #ff6b35;
            border-color: #ff9f7b;
            color: #0b0f17;
        }
        .stats {
            float: right;
            color: #9ab8d9;
            font-size: 1rem;
            line-height: 52px;
        }

        /* GRID CONFIGURADO PARA 4 COLUMNAS EXACTAS */
        .grid {
            margin: 20px 0;
            font-size: 0; /* Elimina espacio entre elementos inline-block */
            text-align: center;
        }
        .theme-card {
            width: 295px; /* Aumentado para mayor visibilidad */
            background: #0e1727;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1f3a4c;
            box-shadow: 0 10px 18px #00000080;
            display: inline-block;
            vertical-align: top;
            margin: 10px; /* Margen para cuadrar 4 en 1260px */
            font-size: 16px;
            text-align: left;
        }
        .preview {
            width: 100%;
            background: #03070f;
            text-align: center;
            border-bottom: 3px solid #ff6b35;
            height: 220px; /* Más grande para que destaque la imagen */
            line-height: 220px;
        }
        .preview img {
            max-width: 100%;
            max-height: 100%;
            vertical-align: middle;
        }
        .card-info {
            padding: 18px 15px;
        }
        .theme-name {
            font-weight: 600;
            font-size: 1.1rem;
            line-height: 1.3;
            margin-bottom: 12px;
            color: #fff;
            height: 2.6em; /* Altura fija para que los botones se alineen */
            overflow: hidden;
        }
        .theme-genre {
            background: #122b3b;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #ffb28c;
            margin-bottom: 18px;
            display: inline-block;
            border: 1px solid #ff6b3540;
        }
        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: 700;
            padding: 14px;
            border-radius: 50px;
            text-align: center;
            font-size: 1rem;
            display: block;
            text-transform: uppercase;
            border-bottom: 4px solid #a03d1e;
        }

        .load-more {
            text-align: center;
            margin: 30px 0;
            clear: both;
        }
        .btn-primary {
            background: #ff6b35;
            color: #0b0f17;
            padding: 15px 60px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            border: 2px solid #ff9f7b;
        }
        .footer {
            margin: 50px 20px 20px 20px;
            border-top: 1px solid #ff6b3540;
            padding-top: 20px;
            color: #b0c8e0;
            font-size: 1rem;
            overflow: hidden;
        }
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header clearfix">
            <img src="recursos/titulo.png" alt="PS3 Themes" class="logo-img" onerror="this.style.display='none'">
            <div class="social-container">
                <a href="https://www.youtube.com/@kizeo0/videos"><img src="recursos/yt.png" alt="YT" class="social-icon"></a>
                <a href="https://github.com/kizeo0"><img src="recursos/git.png" alt="Git" class="social-icon"></a>
                <a href="https://x.com/KiZeo0"><img src="recursos/x.png" alt="X" class="social-icon"></a>
            </div>
        </div>

        <div class="toolbar clearfix">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Buscar tema...">
                <div class="dice-btn" id="randomBtn" title="Temas aleatorios">
                    <img src="recursos/dado.png" alt="Aleatorio" class="dice-img" onerror="this.style.display='none'">
                </div>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn" id="sortAZ">A-Z</button>
                <button class="sort-btn" id="sortZA">Z-A</button>
            </div>
            <div class="stats" id="stats">cargando...</div>
        </div>

        <div id="themeGrid" class="grid">
            <div style="color:#ffb28c; font-size:20px; padding:100px;">⌛ cargando temas...</div>
        </div>

        <div class="load-more" id="loadMoreContainer" style="display: none;">
            <button class="btn-primary" id="loadMoreBtn">+ cargar más temas</button>
        </div>

        <div class="footer clearfix">
            <span style="float:left">© PS3 · temas p3t</span>
            <span style="float:right">kizeo0</span>
        </div>
    </div>

    <script>
        var JSON_URL = 'temas_ps3_conlinks.json';
        var PREVIEW_FOLDERS = ['previews1/', 'previews2/'];
        var PAGE_SIZE = 16; // Múltiplo de 4 para que las filas siempre estén completas

        var allThemes = [];
        var filteredThemes = [];
        var currentSort = 'none';
        var currentPage = 0;

        var grid = document.getElementById('themeGrid');
        var statsDiv = document.getElementById('stats');
        var loadMoreContainer = document.getElementById('loadMoreContainer');

        var xhr = new XMLHttpRequest();
        xhr.open('GET', JSON_URL, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var data = eval('(' + xhr.responseText + ')');
                    procesarDatos(data);
                } catch (e) {
                    grid.innerHTML = '<div style="color:red">Error en el JSON</div>';
                }
            }
        };
        xhr.send();

        function procesarDatos(temas) {
            for (var i = 0; i < temas.length; i++) {
                var item = temas[i];
                allThemes.push({
                    archivo: item.archivo,
                    descarga: item.descarga,
                    genero: item.genero || 'Otro',
                    nombre: item.archivo.replace(/\.p3t$/i, '')
                });
            }
            aplicarFiltros();
        }

        function aplicarFiltros() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            filteredThemes = [];
            
            for(var i=0; i<allThemes.length; i++) {
                if(allThemes[i].nombre.toLowerCase().indexOf(search) !== -1) {
                    filteredThemes.push(allThemes[i]);
                }
            }

            if (currentSort === 'az') {
                filteredThemes.sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
            } else if (currentSort === 'za') {
                filteredThemes.sort(function(a,b){ return b.nombre.localeCompare(a.nombre); });
            }

            currentPage = 0;
            render(true);
        }

        function render(reset) {
            if (reset) grid.innerHTML = '';
            var start = currentPage * PAGE_SIZE;
            var end = start + PAGE_SIZE;
            var html = '';

            for (var i = start; i < end && i < filteredThemes.length; i++) {
                var t = filteredThemes[i];
                var img = encodeURI(t.nombre + '.png');
                
                html += '<div class="theme-card">' +
                    '<div class="preview">' +
                        '<img src="' + PREVIEW_FOLDERS[0] + img + '" onerror="this.src=\'' + PREVIEW_FOLDERS[1] + img + '\'; this.onerror=function(){this.style.display=\'none\';}"> ' +
                    '</div>' +
                    '<div class="card-info">' +
                        '<div class="theme-name">' + t.nombre + '</div>' +
                        '<div class="theme-genre">' + t.genero + '</div>' +
                        '<a href="' + t.descarga + '" class="download-btn">descargar</a>' +
                    '</div>' +
                '</div>';
            }

            if (reset) grid.innerHTML = html;
            else grid.innerHTML += html;

            statsDiv.innerHTML = filteredThemes.length + ' temas';
            loadMoreContainer.style.display = (end < filteredThemes.length) ? 'block' : 'none';
        }

        // Eventos básicos
        document.getElementById('loadMoreBtn').onclick = function() {
            currentPage++;
            render(false);
        };

        document.getElementById('searchInput').oninput = aplicarFiltros;

        document.getElementById('sortAZ').onclick = function() {
            currentSort = (currentSort === 'az') ? 'none' : 'az';
            this.className = (currentSort === 'az') ? 'sort-btn active' : 'sort-btn';
            document.getElementById('sortZA').className = 'sort-btn';
            aplicarFiltros();
        };

        document.getElementById('sortZA').onclick = function() {
            currentSort = (currentSort === 'za') ? 'none' : 'za';
            this.className = (currentSort === 'za') ? 'sort-btn active' : 'sort-btn';
            document.getElementById('sortAZ').className = 'sort-btn';
            aplicarFiltros();
        };

        document.getElementById('randomBtn').onclick = function() {
            filteredThemes.sort(function() { return 0.5 - Math.random() });
            currentPage = 0;
            render(true);
        };
    </script>
</body>
</html>
