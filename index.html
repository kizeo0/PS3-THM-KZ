<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 THM KZ</title>
    <style>
        /* RESET SEGURO PARA PS3 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: Arial, sans-serif; /* Fuente estándar para PS3 */
            line-height: 1.5;
            padding: 20px 0;
            min-height: 100vh;
            text-align: center;
        }

        .main-container {
            width: 1000px; /* Reducido para mejor visualización en TV */
            margin: 0 auto;
            text-align: left;
        }

        .header {
            overflow: hidden;
            margin-bottom: 30px;
            border-bottom: 4px solid #ff6b35;
            padding-bottom: 20px;
        }

        .logo-img {
            height: 80px;
            width: auto;
            float: left;
            display: block;
            cursor: pointer;
        }

        .social-container {
            float: right;
            background: #0a1a2a;
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid #ff6b35;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            margin: 0 5px;
            display: inline-block;
            vertical-align: middle;
        }

        .toolbar {
            background: #0a1a2a;
            padding: 15px;
            border-radius: 40px;
            margin: 0 0 30px 0;
            border-left: 5px solid #ff6b35;
            overflow: hidden;
        }

        .search-wrapper {
            float: left;
        }

        .search-wrapper input {
            width: 200px;
            padding: 10px 15px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 20px;
            color: white;
            vertical-align: middle;
        }

        .dice-btn {
            display: inline-block;
            width: 42px;
            height: 42px;
            margin-left: 8px;
            background: #1e3b4f;
            border: 2px solid #ff6b35;
            border-radius: 50%;
            text-align: center;
            line-height: 42px;
            cursor: pointer;
            vertical-align: middle;
        }

        .dice-img {
            width: 24px;
            height: 24px;
            vertical-align: middle;
        }

        .sort-buttons {
            float: left;
            margin-left: 15px;
        }

        .sort-btn {
            background: #1e3b4f;
            border: 1px solid #ff6b35;
            color: #c9d9e8;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-block;
            margin-right: 5px;
            font-size: 14px;
        }

        .sort-btn.active {
            background: #ff6b35;
            color: #0b0f17;
        }

        .btn-adult { border-color: #ff3535; color: #ff9b9b; }
        .btn-adult.active { background: #ff3535; color: white; }

        .stats {
            float: right;
            color: #9ab8d9;
            line-height: 42px;
        }

        .grid {
            margin: 20px 0;
            text-align: center;
        }

        .theme-card {
            width: 230px; /* Más compacto para PS3 */
            background: #0e1727;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #1f3a4c;
            display: inline-block;
            vertical-align: top;
            margin: 8px;
            text-align: left;
        }

        .preview {
            width: 100%;
            background: #03070f;
            text-align: center;
            border-bottom: 2px solid #ff6b35;
            height: 180px;
            line-height: 180px;
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;
            vertical-align: middle;
        }

        .card-info { padding: 12px; }

        .theme-name {
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            height: 3em;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .theme-genre {
            background: #122b3b;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            color: #ffb28c;
            margin-bottom: 12px;
            display: inline-block;
            border: 1px solid #ff6b3540;
        }

        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            border-radius: 20px;
            text-align: center;
            display: block;
            font-size: 13px;
        }

        .load-more { text-align: center; margin: 30px 0; clear: both; }

        .btn-primary {
            background: #ff6b35;
            color: #0b0f17;
            padding: 12px 40px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            margin: 40px 0;
            border-top: 1px solid #ff6b3540;
            padding-top: 20px;
            color: #b0c8e0;
            font-size: 18px;
        }

        .clearfix::after { content: ""; display: table; clear: both; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header clearfix">
        <img src="recursos/titulo.png" alt="PS3 Themes" class="logo-img" id="logoPrincipal" onclick="volverInicio()">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos"><img src="recursos/yt.png" alt="YT" class="social-icon"></a>
            <a href="https://github.com/kizeo0"><img src="recursos/git.png" alt="Git" class="social-icon"></a>
            <a href="https://x.com/KiZeo0"><img src="recursos/x.png" alt="X" class="social-icon"></a>
        </div>
    </div>

    <div class="toolbar clearfix">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="buscarTemas()">
            <div class="dice-btn" onclick="modoAleatorio()">
                <img src="recursos/dado.png" alt="D" class="dice-img">
            </div>
        </div>
        <div class="sort-buttons">
            <button class="sort-btn" id="sortAZ" onclick="ordenarAZ()">A-Z</button>
            <button class="sort-btn" id="sortZA" onclick="ordenarZA()">Z-A</button>
            <button class="sort-btn btn-adult" id="adultBtn" onclick="toggleAdulto()">+18 OFF</button>
        </div>
        <div class="stats" id="stats">...</div>
    </div>

    <div id="themeGrid" class="grid">
        <div style="padding:50px; color:#ffb28c;">Cargando base de datos...</div>
    </div>

    <div class="load-more" id="loadMoreContainer" style="display: none;">
        <button class="btn-primary" onclick="cargarMas()">Ver más temas</button>
    </div>

    <div class="footer clearfix">
        <span style="float:left">© PS3 · Temas P3T</span>
        <span style="float:right">kizeo0</span>
    </div>
</div>

<script>
    // CONFIGURACIÓN
    var JSON_URL = 'temas_ps3_conlinks.json';
    var PAGE_SIZE = 12; // Reducido para RAM de PS3
    var PALABRAS_ADULTO = ['adult','18+','girls/adult','girl','sexy','ecchi','hentai','babes','harem'];
    var PREVIEW_FOLDERS = [
        'previews1/', 'previews2/', 
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud/main/previews3/',
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud1/main/previews4/'
    ];

    // VARIABLES GLOBALES
    var allThemes = [];
    var filteredThemes = [];
    var currentSort = 'none';
    var currentPage = 0;
    var currentGenre = '';
    var mostrarContenidoAdulto = false;

    // Elementos DOM
    var grid = document.getElementById('themeGrid');
    var statsDiv = document.getElementById('stats');
    var loadMoreContainer = document.getElementById('loadMoreContainer');
    var searchInput = document.getElementById('searchInput');
    var adultBtn = document.getElementById('adultBtn');

    // Inicialización segura de preferencia
    try {
        var pref = localStorage.getItem('ps3_adult_filter');
        mostrarContenidoAdulto = (pref === 'true');
    } catch(e) {}

    function intentarSiguienteCarpeta(imgElement, currentIndex, imgName) {
        var nextIndex = currentIndex + 1;
        if (nextIndex < PREVIEW_FOLDERS.length) {
            imgElement.src = PREVIEW_FOLDERS[nextIndex] + imgName;
            imgElement.onerror = function() { intentarSiguienteCarpeta(imgElement, nextIndex, imgName); };
        } else {
            imgElement.style.display = 'none';
        }
    }

    // CARGA DE DATOS (AJAX COMPATIBLE)
    var xhr = new XMLHttpRequest();
    xhr.open('GET', JSON_URL, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200 || xhr.status === 0) {
                try {
                    var data;
                    if (window.JSON && window.JSON.parse) {
                        data = JSON.parse(xhr.responseText);
                    } else {
                        data = eval('(' + xhr.responseText + ')');
                    }
                    
                    allThemes = [];
                    for(var i=0; i<data.length; i++) {
                        var item = data[i];
                        allThemes.push({
                            archivo: item.archivo,
                            descarga: item.descarga,
                            genero: item.genero || 'Otro',
                            nombre: item.archivo.replace(/\.p3t$/i, ''),
                            preview_idx: (item.preview_idx !== undefined) ? item.preview_idx : 0
                        });
                    }
                    actualizarInterfazBoton();
                    aplicarFiltros();
                } catch (e) {
                    grid.innerHTML = '<div style="color:red;">Error de datos.</div>';
                }
            } else {
                grid.innerHTML = '<div style="color:red;">No se pudo cargar el JSON.</div>';
            }
        }
    };
    xhr.send();

    window.toggleAdulto = function() {
        mostrarContenidoAdulto = !mostrarContenidoAdulto;
        try { localStorage.setItem('ps3_adult_filter', mostrarContenidoAdulto); } catch(e) {}
        actualizarInterfazBoton();
        aplicarFiltros();
    };

    function actualizarInterfazBoton() {
        if (mostrarContenidoAdulto) {
            adultBtn.innerHTML = "+18 ON";
            adultBtn.className = "sort-btn btn-adult active";
        } else {
            adultBtn.innerHTML = "+18 OFF";
            adultBtn.className = "sort-btn btn-adult";
        }
    }

    function aplicarFiltros() {
        var search = searchInput.value.toLowerCase();
        filteredThemes = [];
        
        for (var i = 0; i < allThemes.length; i++) {
            var tema = allThemes[i];
            var genLower = tema.genero.toLowerCase();

            var esTemaAdulto = false;
            for (var j = 0; j < PALABRAS_ADULTO.length; j++) {
                if (genLower.indexOf(PALABRAS_ADULTO[j]) !== -1) {
                    esTemaAdulto = true;
                    break;
                }
            }

            if (!mostrarContenidoAdulto && esTemaAdulto) continue;

            var nombreMatch = tema.nombre.toLowerCase().indexOf(search) !== -1;
            var generoMatch = (currentGenre === '') || (genLower === currentGenre.toLowerCase());
            
            if (nombreMatch && generoMatch) {
                filteredThemes.push(tema);
            }
        }

        if (currentSort === 'az') {
            filteredThemes.sort(function(a, b) { return a.nombre < b.nombre ? -1 : 1; });
        } else if (currentSort === 'za') {
            filteredThemes.sort(function(a, b) { return a.nombre > b.nombre ? -1 : 1; });
        }
        currentPage = 0;
        render(true);
    }

    function render(reset) {
        if (reset) grid.innerHTML = '';
        var start = currentPage * PAGE_SIZE;
        var end = (start + PAGE_SIZE > filteredThemes.length) ? filteredThemes.length : start + PAGE_SIZE;
        var html = '';

        for (var i = start; i < end; i++) {
            var t = filteredThemes[i];
            var imgName = encodeURI(t.nombre + '.png').replace(/'/g, "%27").replace(/&/g, "%26");
            var startIdx = t.preview_idx;
            var folderBase = PREVIEW_FOLDERS[startIdx] || PREVIEW_FOLDERS[0];
            var nombreVisible = t.nombre.replace(/\(nombre igual\)/gi, "").replace(/pkg/gi, "");

            html += '<div class="theme-card">' +
                        '<div class="preview">' +
                            '<img src="' + folderBase + imgName + '" ' +
                            'onerror="intentarSiguienteCarpeta(this, ' + startIdx + ', \'' + imgName + '\')">' +
                        '</div>' +
                        '<div class="card-info">' +
                            '<div class="theme-name">' + nombreVisible + '</div>' +
                            '<div class="theme-genre" onclick="filtrarPorGenero(\'' + t.genero + '\')">' + t.genero + '</div>' +
                            '<a href="' + t.descarga + '" class="download-btn">Descargar</a>' +
                        '</div>' +
                    '</div>';
        }

        if (reset) grid.innerHTML = html; else grid.innerHTML += html;
        statsDiv.innerHTML = filteredThemes.length + ' temas';
        loadMoreContainer.style.display = (end < filteredThemes.length) ? 'block' : 'none';
    }

    window.filtrarPorGenero = function(g) { currentGenre = g; searchInput.value = ''; aplicarFiltros(); };
    window.volverInicio = function() { searchInput.value = ''; currentGenre = ''; currentSort = 'none'; aplicarFiltros(); };
    window.buscarTemas = function() { currentGenre = ''; aplicarFiltros(); };
    window.cargarMas = function() { currentPage++; render(false); };
    window.ordenarAZ = function() { currentSort = 'az'; aplicarFiltros(); };
    window.ordenarZA = function() { currentSort = 'za'; aplicarFiltros(); };
    window.modoAleatorio = function() {
        filteredThemes.sort(function() { return 0.5 - Math.random(); });
        currentPage = 0;
        render(true);
    };
</script>
</body>
</html>
