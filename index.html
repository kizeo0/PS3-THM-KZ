<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS3 THM KZ</title>
    <script>
        /* ── DETECCION PS3 ── ejecutar ANTES del render ──────────── */
        var isPS3 = /PS3|PlayStation 3|NetFront/i.test(navigator.userAgent)
                 || window.location.search.indexOf('mode=ps3') > -1;

        /* Igual que la referencia: forzar ventana a pantalla completa */
        if (isPS3) {
            try { window.resizeTo(screen.width, screen.height); } catch(e) {}
        }

        /* Clase en <html> disponible para CSS desde el primer píxel */
        document.documentElement.className = isPS3 ? 'is-ps3' : 'is-pc';
    </script>
    <style>
        /* ── RESET ────────────────────────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        /*
         * PRINCIPIO CLAVE DE LA REFERENCIA:
         * En PS3 no existe contenedor de ancho fijo.
         * Todo es fluido: width:100%, left:0/right:0, posiciones fijas.
         * Esto hace que la página se adapte SOLA a 4:3 o 16:9
         * sin necesitar detectar el ratio de pantalla.
         */

        /* ── BODY ─────────────────────────────────────────────────── */
        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: Arial, sans-serif;
            line-height: 1.2;
            text-align: center;
        }

        .is-pc body {
            padding: 20px 0;
            overflow-x: hidden;
        }

        /* PS3: sin scroll en body, la página es fullscreen */
        .is-ps3 body {
            overflow: hidden;
            height: 100%;
            padding: 0;
        }

        /* PS3: desactivar transiciones y animaciones para ahorrar CPU */
        .is-ps3 * {
            -webkit-transition: none !important;
            transition: none !important;
            -webkit-animation: none !important;
            animation: none !important;
        }

        /* ── CONTENEDOR PRINCIPAL ─────────────────────────────────── */
        /* PC: ancho fijo centrado, igual que antes */
        .is-pc .main-container {
            width: 1750px;
            margin: 0 auto;
            text-align: left;
            padding: 0 10px;
        }

        /*
         * PS3: 100% fluido, sin ancho fijo, ocupa toda la pantalla.
         * Funciona igual en 16:9 que en 4:3 porque no hay anchura fija.
         */
        .is-ps3 .main-container {
            width: 100%;
            margin: 0;
            text-align: left;
            padding: 0;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        /* ── HEADER ───────────────────────────────────────────────── */
        .header {
            overflow: hidden;
            border-bottom: 5px solid #ff6b35;
            padding-bottom: 15px;
            text-align: center;
        }

        .is-pc .header {
            margin-bottom: 25px;
            padding-top: 20px;
        }

        /*
         * PS3: header fijo en la parte superior, ancho total.
         * Exactamente como en la referencia.
         */
        .is-ps3 .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: #0b0f17;
            padding: 8px 10px;
            margin: 0;
        }

        .logo-img {
            height: 115px;
            float: left;
            cursor: pointer;
        }

        .is-ps3 .logo-img { height: 58px; }

        .social-container {
            float: right;
            background: #0a1a2a;
            padding: 10px 30px;
            border-radius: 60px;
            border: 3px solid #ff6b35;
            margin-top: 15px;
        }

        .is-ps3 .social-container {
            padding: 5px 12px;
            border-radius: 30px;
            margin-top: 5px;
            border-width: 2px;
        }

        .social-icon {
            width: 62px;
            height: 62px;
            margin: 0 7px;
            vertical-align: middle;
        }

        .is-ps3 .social-icon { width: 34px; height: 34px; margin: 0 3px; }

        /* Banner de créditos: oculto en PS3 */
        .credits-banner {
            height: 42px;
            display: inline-block;
            margin-top: 73px;
            margin-bottom: -20px;
            vertical-align: bottom;
        }

        .is-ps3 .credits-banner { display: none; }

        /* ── TOOLBAR ──────────────────────────────────────────────── */
        .toolbar {
            display: table;
            width: 100%;
            background: #0a1a2a;
            padding: 15px 25px;
            border-radius: 60px;
            margin-bottom: 25px;
            border-left: 6px solid #ff6b35;
            height: 86px;
            box-sizing: border-box;
        }

        /*
         * PS3: toolbar fija debajo del header (~78px).
         * position:fixed + left:0/right:0 = se adapta a cualquier ancho.
         */
        .is-ps3 .toolbar {
            position: fixed;
            top: 78px;
            left: 0;
            right: 0;
            z-index: 19;
            border-radius: 0;
            margin: 0;
            padding: 5px 8px;
            height: auto;
            border-left: none;
            border-top: 2px solid #ff6b35;
            display: block;
            background: #0a1a2a;
        }

        .toolbar-left, .toolbar-right {
            display: table-cell;
            vertical-align: middle;
        }

        .toolbar-right { text-align: right; }

        .is-ps3 .toolbar-left  { display: inline-block; vertical-align: middle; }
        .is-ps3 .toolbar-right { display: inline-block; vertical-align: middle; float: right; }

        .search-wrapper {
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        .search-wrapper input {
            width: 310px;
            height: 50px;
            padding: 0 22px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            vertical-align: middle;
        }

        .is-ps3 .search-wrapper input {
            width: 150px;
            height: 30px;
            font-size: 12px;
            padding: 0 8px;
            border-radius: 15px;
        }

        .btn-aleatorio {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 0 20px;
            border-radius: 40px;
            height: 50px;
            line-height: 50px;
            font-size: 14px;
            border: 2px solid #ff6b35;
            vertical-align: middle;
            cursor: pointer;
            margin-left: 10px;
            text-transform: uppercase;
        }

        .is-ps3 .btn-aleatorio {
            height: 30px;
            line-height: 30px;
            font-size: 11px;
            padding: 0 8px;
            margin-left: 4px;
        }

        .sort-buttons {
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        .sort-btn {
            height: 50px;
            background: #1e3b4f;
            border: 2px solid #1e3b4f;
            color: #c9d9e8;
            padding: 0 22px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 7px;
            font-size: 15px;
            vertical-align: middle;
            line-height: 46px;
        }

        .is-ps3 .sort-btn {
            height: 30px;
            line-height: 26px;
            font-size: 11px;
            padding: 0 8px;
            margin-right: 3px;
        }

        .stats {
            display: inline-block;
            vertical-align: middle;
            color: #9ab8d9;
            font-weight: bold;
            font-size: 18px;
            margin-right: 20px;
        }

        .is-ps3 .stats { font-size: 11px; margin-right: 6px; }

        .btn-pkg {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 0 25px;
            border-radius: 40px;
            height: 50px;
            line-height: 50px;
            font-size: 16px;
            border: 2px solid #ff6b35;
            vertical-align: middle;
        }

        .is-ps3 .btn-pkg {
            height: 30px;
            line-height: 30px;
            font-size: 11px;
            padding: 0 10px;
        }

        .sort-btn.active   { background: #ff6b35; color: #0b0f17; border-color: #ff6b35; }
        .btn-genre-active  { background: #0b1a2a; border-color: #ffb28c; color: #ffb28c; display: none; }
        .btn-adult         { border-color: #ff3535; color: #ff9b9b; }
        .btn-adult.active  { background: #ff3535; color: white; }

        /* ── CUADRO RECIEN AGREGADOS ──────────────────────────────── */
        .recent-sidebar-box {
            background: #0a1a2a;
            border-radius: 18px;
            border: 2px solid #1e3b4f;
            border-left: 5px solid #ff6b35;
            padding: 10px 12px;
            margin-bottom: 12px;
            text-align: center;
        }

        .is-ps3 .recent-sidebar-box {
            border-radius: 8px;
            padding: 5px 6px;
            margin-bottom: 7px;
        }

        /* El botón de recientes ocupa todo el ancho del cuadro */
        .btn-recent {
            border-color: #35b8ff;
            color: #7dd4ff;
            width: 100%;
            margin-right: 0;
            padding: 0 10px;
        }

        .btn-recent.active {
            background: #35b8ff;
            color: #0b0f17;
            border-color: #35b8ff;
        }

        /* ══════════════════════════════════════════════════════════
           ZONA SCROLLEABLE (PS3)
           ══════════════════════════════════════════════════════════
           Equivalente al <div class="content"> de la referencia.
           top = altura del header fijo + toolbar fija.
           left:0 / right:0 → se adapta a cualquier ancho de pantalla,
           tanto en 16:9 como en 4:3, sin media queries.
        ═══════════════════════════════════════════════════════════ */
        .is-ps3 .ps3-scroll-area {
            position: fixed;
            top: 124px;   /* header ~78px + toolbar ~46px */
            bottom: 0;
            left: 0;
            right: 0;
            overflow-y: scroll;
            overflow-x: hidden;
            z-index: 1;
            padding: 8px 6px 16px 6px;
        }

        /* ── LAYOUT SIDEBAR + GRID ────────────────────────────────── */
        .body-layout {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .sidebar-cell {
            display: table-cell;
            width: 220px;
            vertical-align: top;
            padding-right: 18px;
        }

        /* PS3: sidebar más estrecho, se adapta con el resto */
        .is-ps3 .sidebar-cell {
            width: 105px;
            padding-right: 5px;
        }

        .content-cell { display: table-cell; vertical-align: top; }

        /* ── SIDEBAR ──────────────────────────────────────────────── */
        .genre-sidebar {
            background: #0a1a2a;
            border-radius: 18px;
            border: 2px solid #1e3b4f;
            border-left: 5px solid #ff6b35;
            overflow: hidden;
        }

        .is-ps3 .genre-sidebar { border-radius: 8px; }

        .sidebar-title {
            background: #ff6b35;
            color: #0b0f17;
            font-weight: bold;
            font-size: 15px;
            padding: 13px 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .is-ps3 .sidebar-title {
            font-size: 10px;
            padding: 6px 7px;
            letter-spacing: 0;
        }

        .genre-list { overflow: visible; }

        .genre-item {
            display: block;
            width: 100%;
            padding: 11px 16px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #0f2030;
            color: #b0c8e0;
            font-size: 14px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            text-decoration: none;
        }

        .is-ps3 .genre-item { font-size: 10px; padding: 5px 6px; }

        .genre-item.active {
            background: #1e3b4f;
            color: #ff6b35;
            border-left: 4px solid #ff6b35;
            padding-left: 12px;
        }

        .is-ps3 .genre-item.active { padding-left: 5px; }

        .todos-count {
            float: right;
            background: #0b1a2a;
            color: #5a7a90;
            font-size: 12px;
            padding: 2px 7px;
            border-radius: 8px;
            font-weight: normal;
        }

        .is-ps3 .todos-count { display: none; }

        .genre-item.active .todos-count { background: #ff6b3530; color: #ffb28c; }

        /* ── GRID ─────────────────────────────────────────────────── */
        .grid { text-align: center; min-height: 600px; }

        .is-ps3 .grid { min-height: 200px; }

        /*
         * PC: tarjeta original de 350px
         * PS3: tarjeta de ancho FIJO en píxeles, igual que la referencia
         * (que usa 155px fijos para sus tiles).
         * Con inline-block + text-align:center el navegador las acomoda
         * automáticamente: en 16:9 caben más columnas, en 4:3 menos,
         * sin estiramiento porque el ancho nunca cambia.
         */
        .theme-card {
            width: 350px;
            background: #0e1727;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #1f3a4c;
            display: inline-block;
            vertical-align: top;
            margin: 12px;
            text-align: left;
        }

        /*
         * PS3: 270px llena bien una TV 16:9 (caben ~4 tarjetas por fila)
         * y en 4:3 (zona ~650px libre) caben ~2, igual de limpio.
         * Ancho fijo = sin estiramiento en ningún ratio.
         * Ratio preview: 270 × (225/350) ≈ 174px de alto → sin distorsión.
         */
        .is-ps3 .theme-card {
            width: 270px;
            margin: 7px 6px;
            border-radius: 12px;
        }

        .preview {
            width: 100%;
            background: #000;
            text-align: center;
            border-bottom: 3px solid #ff6b35;
            height: 225px;
            line-height: 225px;
            overflow: hidden;
        }

        .is-ps3 .preview {
            height: 174px;
            line-height: 174px;
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;
            vertical-align: middle;
        }

        .is-ps3 .preview img {
            width: 270px;
            height: 174px;
            object-fit: cover;
        }

        .card-info    { padding: 20px; }
        .is-ps3 .card-info { padding: 10px 12px; }

        .theme-name {
            font-weight: bold;
            font-size: 19px;
            color: #fff;
            height: 45px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .is-ps3 .theme-name { font-size: 13px; height: 34px; margin-bottom: 5px; }

        .theme-genre {
            background: #1e3b4f;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #ffb28c;
            margin-bottom: 15px;
            display: inline-block;
            border: 1px solid #ff6b35;
            cursor: pointer;
        }

        .is-ps3 .theme-genre {
            font-size: 11px;
            padding: 4px 8px;
            margin-bottom: 8px;
            border-radius: 7px;
        }

        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: bold;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            display: block;
            font-size: 15px;
        }

        .is-ps3 .download-btn { font-size: 13px; padding: 9px; border-radius: 20px; }

        /* ── PAGINACION ───────────────────────────────────────────── */
        .pagination-container { text-align: center; margin: 40px 0; }
        .is-ps3 .pagination-container { margin: 12px 0; }

        .page-box {
            display: inline-block;
            width: 50px;
            height: 50px;
            line-height: 46px;
            background: #1e3b4f;
            border: 2px solid #1e3b4f;
            color: #fff;
            margin: 0 4px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            vertical-align: middle;
        }

        .is-ps3 .page-box {
            width: 32px;
            height: 32px;
            line-height: 28px;
            font-size: 12px;
            margin: 0 2px;
            border-radius: 5px;
        }

        .page-box.active { background: #ff6b35; border-color: #ff6b35; color: #0b0f17; }

        /* ── FOOTER ───────────────────────────────────────────────── */
        .footer {
            margin-top: 50px;
            border-top: 3px solid #ff6b3540;
            padding: 25px 0;
            color: #b0c8e0;
            font-size: 16px;
        }

        .is-ps3 .footer { margin-top: 15px; padding: 8px 0; font-size: 11px; }

        .clearfix::after { content: ""; display: table; clear: both; }

        /* ── SCROLLBAR PS3 ────────────────────────────────────────── */
        .is-ps3 ::-webkit-scrollbar       { width: 5px; }
        .is-ps3 ::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); }
        .is-ps3 ::-webkit-scrollbar-thumb { background: #ff6b35; border-radius: 3px; }

        /* ══════════════════════════════════════════════════════════
           MOBILE — solo aplica en .is-pc con pantalla pequeña.
           No toca NADA de .is-ps3 ni de la lógica existente.
        ══════════════════════════════════════════════════════════ */

        /* Contenedor: fluido en cualquier pantalla más angosta que 1750px */
        @media screen and (max-width: 1800px) {
            .is-pc .main-container {
                width: 100%;
                max-width: 1750px;
                padding: 0 12px;
            }
        }

        /* Tablet y móvil (≤900px) */
        @media screen and (max-width: 900px) {

            /* Header: logo y social apilados y centrados */
            .is-pc .header {
                padding-bottom: 12px;
            }
            .is-pc .logo-img {
                float: none;
                display: block;
                margin: 0 auto;
                height: auto;
                max-height: 58px;
                max-width: 80%;
            }
            .is-pc .credits-banner { display: none; }
            .is-pc .social-container {
                float: none;
                display: block;
                width: -webkit-fit-content;
                width: fit-content;
                margin: 8px auto 0;
                padding: 7px 18px;
            }
            .is-pc .social-icon {
                width: 44px;
                height: 44px;
                margin: 0 4px;
            }

            /* Toolbar: bloque con elementos en fila y centrados */
            .is-pc .toolbar {
                display: block;
                height: auto;
                padding: 10px 12px;
                border-radius: 20px;
                text-align: center;
            }
            /* toolbar-left y toolbar-right: bloques centrados uno sobre otro */
            .is-pc .toolbar-left {
                display: block;
                text-align: center;
                margin-bottom: 8px;
            }
            .is-pc .toolbar-right {
                display: block;
                text-align: center;
            }
            /* search-wrapper sigue siendo inline-block:
               el input y el botón Aleatorio quedan juntos en la misma fila */
            .is-pc .search-wrapper {
                display: inline-block;
                vertical-align: middle;
                margin-right: 6px;
                margin-bottom: 6px;
            }
            .is-pc .search-wrapper input {
                width: 160px;
            }
            /* sort-buttons inline-block: botones en la misma fila que search */
            .is-pc .sort-buttons {
                display: inline-block;
                vertical-align: middle;
                margin-right: 0;
            }

            /* Layout: sidebar y grid apilados verticalmente */
            .is-pc .body-layout { display: block; width: 100%; }
            .is-pc .sidebar-cell {
                display: block;
                width: 100%;
                padding-right: 0;
                margin-bottom: 14px;
            }
            .is-pc .content-cell { display: block; width: 100%; }

            /* Sidebar de géneros: scroll horizontal táctil */
            .is-pc .genre-list {
                display: -webkit-box;
                display: -ms-flexbox;
                display: flex;
                -ms-flex-wrap: nowrap;
                    flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .is-pc .genre-item {
                -ms-flex-negative: 0;
                    flex-shrink: 0;
                width: auto;
                border-bottom: none;
                border-right: 1px solid #0f2030;
                white-space: nowrap;
            }
            .is-pc .genre-item.active {
                border-left: none;
                border-bottom: 3px solid #ff6b35;
            }

            /* Tarjetas: 2 columnas */
            .is-pc .theme-card { width: calc(50% - 24px); }
        }

        /* Móvil pequeño (≤500px): 1 columna y botones más compactos */
        @media screen and (max-width: 500px) {
            .is-pc .theme-card { width: calc(100% - 24px); }
            .is-pc .search-wrapper input { width: 130px; }
            .is-pc .btn-aleatorio { padding: 0 10px; font-size: 13px; }
            .is-pc .sort-btn     { padding: 0 12px; font-size: 13px; margin-right: 4px; }
            .is-pc .btn-pkg      { padding: 0 14px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- HEADER: fijo en PS3 -->
    <div class="header clearfix">
        <img src="recursos/titulo.png" alt="Logo" class="logo-img" onclick="volverInicio()">
        <img src="recursos/credits.png" class="credits-banner">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos"><img src="recursos/yt.png" class="social-icon" width="62" height="62"></a>
            <a href="https://github.com/kizeo0"><img src="recursos/git.png" class="social-icon" width="62" height="62"></a>
            <a href="https://x.com/KiZeo0"><img src="recursos/x.png" class="social-icon" width="62" height="62"></a>
        </div>
    </div>

    <!-- TOOLBAR: fija en PS3, debajo del header -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="buscarConRetraso()">
                <button class="btn-aleatorio" onclick="modoAleatorio()">Aleatorio</button>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn btn-adult" id="adultBtn" onclick="toggleAdulto()">+18 OFF</button>
                <button class="sort-btn btn-genre-active" id="genreActiveBtn" onclick="volverInicio()"></button>
            </div>
        </div>
        <div class="toolbar-right">
            <span class="stats" id="stats">...</span>
            <a href="https://github.com/kizeo0/PS3-THM-KZ/releases/download/PKG/PS3.THM.KZ.pkg" class="btn-pkg">VERSION PKG</a>
        </div>
    </div>

    <!--
        ZONA SCROLLEABLE:
        En PC es un div normal.
        En PS3 es position:fixed con overflow-y:scroll (como la referencia).
        left:0 / right:0 asegura que cubra TODO el ancho disponible,
        ya sea 16:9 o 4:3.
    -->
    <div class="ps3-scroll-area">

        <div class="body-layout">
            <div class="sidebar-cell">

                <!-- CUADRO RECIEN AGREGADOS: encima de géneros -->
                <div class="recent-sidebar-box">
                    <button class="sort-btn btn-recent" id="recentBtn" onclick="toggleReciente()">RECIENTES OFF</button>
                </div>

                <div class="genre-sidebar">
                    <div class="sidebar-title">Generos</div>
                    <div class="genre-list" id="genreList">
                        <div style="padding:12px;color:#5a7a90;font-size:12px;">Cargando...</div>
                    </div>
                </div>
            </div>
            <div class="content-cell">
                <div id="themeGrid" class="grid">
                    <div style="padding:40px;color:#ffb28c;">Cargando base de datos...</div>
                </div>
                <div class="pagination-container" id="pagination"></div>
            </div>
        </div>

        <div class="footer clearfix">
            <span style="float:left">&#169; PS3 THM KZ</span>
            <span style="float:right">Youtube KiZeo</span>
        </div>

    </div><!-- /ps3-scroll-area -->

</div><!-- /main-container -->

<script>
    /* ══════════════════════════════════════════════════════════════
       CONFIGURACION
    ══════════════════════════════════════════════════════════════ */
    var JSON_URL     = 'temas_ps3_conlinks.json';
    var PAGE_SIZE    = isPS3 ? 15  : 12;
    var CHUNK_SIZE   = isPS3 ? 150 : 400;
    var IMG_PARALLEL = isPS3 ? 1  : 2;
    var SEARCH_DELAY = isPS3 ? 800 : 600;

    var ADULTO_KEYS = ['adult','18+','girls/adult','sexy','ecchi','hentai',
                       'babes','harem','j-idols','j-idol','girl','girls'];

    var G_EMPTY = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

    var BASE = 'https://raw.githubusercontent.com/kizeocloud1/Previews-compresed/main/';
    var FOLDERS = [
        BASE+'previews1/', BASE+'previews2/', BASE+'previews3/',
        BASE+'previews4/', BASE+'previews5/', BASE+'previews6/'
    ];

    /* ══════════════════════════════════════════════════════════════
       ESTADO
    ══════════════════════════════════════════════════════════════ */
    var allThemes       = [];
    var genresCache     = [];
    var filteredThemes  = [];
    var currentPage     = 0;
    var currentGenre    = '';
    var mostrarAdulto   = false;
    var esModoAleatorio = false;
    var esModoReciente  = false;   /* NUEVO: modo recién agregados */
    var searchTimer     = null;
    var chunkTimer      = null;
    var imageQueue      = [];
    var imgActivos      = 0;
    var imgTimer        = null;

    var grid        = document.getElementById('themeGrid');
    var statsDiv    = document.getElementById('stats');
    var pagDiv      = document.getElementById('pagination');
    var searchInput = document.getElementById('searchInput');
    var genreList   = document.getElementById('genreList');
    var genreBtn    = document.getElementById('genreActiveBtn');
    var recentBtn   = document.getElementById('recentBtn');   /* NUEVO */

    /* ══════════════════════════════════════════════════════════════
       UTILIDADES
    ══════════════════════════════════════════════════════════════ */
    function trim(s) { return s.replace(/^\s+|\s+$/g, ''); }

    function calcIsAdult(gen) {
        var g = gen.toLowerCase();
        for (var i = 0; i < ADULTO_KEYS.length; i++) {
            if (g.indexOf(ADULTO_KEYS[i]) !== -1) return true;
        }
        return false;
    }

    function cancelarColas() {
        imageQueue  = [];
        imgActivos  = 0;
        if (imgTimer)    { clearTimeout(imgTimer);    imgTimer    = null; }
        if (chunkTimer)  { clearTimeout(chunkTimer);  chunkTimer  = null; }
        if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
    }

    /* ══════════════════════════════════════════════════════════════
       CARGA JSON
    ══════════════════════════════════════════════════════════════ */
    function cargarJSON() {
        var xhr = new XMLHttpRequest();
        var url = isPS3 ? JSON_URL : (JSON_URL + '?t=' + (new Date().getTime()));
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status === 200 || xhr.status === 0) {
                var raw;
                try { raw = JSON.parse(xhr.responseText); }
                catch(e) {
                    grid.innerHTML = '<div style="color:red">Error: JSON invalido.</div>';
                    xhr = null; return;
                }
                xhr = null;
                procesarChunk(raw, 0);
            } else {
                grid.innerHTML = '<div style="color:red">Error al cargar JSON (' + xhr.status + ').</div>';
                xhr = null;
            }
        };
        xhr.send(null);
    }

    function procesarChunk(raw, offset) {
        var fin = Math.min(offset + CHUNK_SIZE, raw.length);
        for (var i = offset; i < fin; i++) {
            var item   = raw[i];
            var nombre = item.archivo.replace(/\.p3t$/i, '');
            var genero = item.genero || 'Otro';
            allThemes.push({
                descarga:    item.descarga,
                genero:      genero,
                nombre:      nombre,
                nombreLower: nombre.toLowerCase(),
                generoLower: genero.toLowerCase(),
                isAdult:     calcIsAdult(genero),
                imgName:     encodeURIComponent(nombre + '.png').replace(/'/g, '%27'),
                safeGenre:   genero.replace(/'/g, '&#39;'),
                preview_idx: item.preview_idx || 0
            });
        }

        grid.innerHTML = '<div style="padding:40px;color:#ffb28c;">Cargando... '
                         + fin + ' / ' + raw.length + '</div>';

        if (fin < raw.length) {
            chunkTimer = setTimeout(function() {
                chunkTimer = null;
                procesarChunk(raw, fin);
            }, isPS3 ? 40 : 20);
        } else {
            raw = null;
            construirCacheGeneros();
            construirSidebar();
            aplicarFiltros();
        }
    }

    /* ══════════════════════════════════════════════════════════════
       GENEROS
    ══════════════════════════════════════════════════════════════ */
    function construirCacheGeneros() {
        var seen = {}, result = [];
        for (var i = 0; i < allThemes.length; i++) {
            var g = allThemes[i].genero;
            if (!seen[g] && (!allThemes[i].isAdult || mostrarAdulto)) {
                seen[g] = true; result.push(g);
            }
        }
        result.sort(function(a,b){ return a<b?-1:a>b?1:0; });
        genresCache = result;
        seen = null;
    }

    function construirSidebar() {
        var total = 0;
        for (var i = 0; i < allThemes.length; i++) {
            if (!allThemes[i].isAdult || mostrarAdulto) total++;
        }
        var parts = [];
        var activeTodos = (currentGenre === '') ? ' active' : '';
        parts.push('<button class="genre-item' + activeTodos + '" id="genre-btn-todos" onclick="volverInicio()">Todos <span class="todos-count">' + total + '</span></button>');
        for (var j = 0; j < genresCache.length; j++) {
            var gn = genresCache[j], activeG = (gn === currentGenre) ? ' active' : '';
            var safeG = gn.replace(/'/g,'&#39;');
            parts.push('<button class="genre-item' + activeG + '" onclick="filtrarPorGenero(\'' + safeG + '\')">' + gn + '</button>');
        }
        genreList.innerHTML = parts.join('');
        parts = null;
    }

    function actualizarSidebarActivo() {
        var items = genreList.getElementsByTagName('button');
        for (var i = 0; i < items.length; i++) {
            var btn = items[i], span = btn.getElementsByTagName('span');
            var label = span.length > 0 ? btn.innerHTML.replace(span[0].outerHTML,'') : btn.innerHTML;
            label = trim(label);
            var isActive = (currentGenre===''&&label==='Todos')||(currentGenre!==''&&label===currentGenre);
            btn.className = isActive ? 'genre-item active' : 'genre-item';
        }
    }

    /* ══════════════════════════════════════════════════════════════
       FILTRADO
    ══════════════════════════════════════════════════════════════ */
    window.buscarConRetraso = function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
            searchTimer = null;
            currentGenre = ''; currentPage = 0; esModoAleatorio = false;
            /* Búsqueda manual cancela modo recientes */
            esModoReciente = false; actualizarRecentBtn();
            actualizarSidebarActivo(); aplicarFiltros();
        }, SEARCH_DELAY);
    };

    function aplicarFiltros() {
        var query = trim(searchInput.value).toLowerCase();
        var hayQuery = query !== '', hayGenre = currentGenre !== '';
        var genreLower = currentGenre.toLowerCase();
        filteredThemes = [];

        genreBtn.style.display = hayGenre ? 'inline-block' : 'none';
        if (hayGenre) genreBtn.innerHTML = currentGenre + ' X';

        for (var i = 0; i < allThemes.length; i++) {
            var t = allThemes[i];
            if (!mostrarAdulto && t.isAdult)                      continue;
            if (hayQuery  && t.nombreLower.indexOf(query) === -1) continue;
            if (hayGenre  && t.generoLower !== genreLower)        continue;
            filteredThemes.push(t);
        }

        /* Modo recientes: invertir para mostrar los últimos del JSON primero */
        if (esModoReciente) {
            filteredThemes.reverse();
        }

        render();
    }

    /* ══════════════════════════════════════════════════════════════
       RENDER
    ══════════════════════════════════════════════════════════════ */
    function crearTarjeta(t, id, destacado) {
        var extra  = destacado ? ' style="border-color:#ffb28c;"' : '';
        var folder = FOLDERS[t.preview_idx] || FOLDERS[0];
        imageQueue.push({ id:'img_'+id, src:folder+t.imgName, name:t.imgName, idx:t.preview_idx });
        var iw = isPS3 ? 270 : 350;
        var ih = isPS3 ? 174 : 225;
        return '<div class="theme-card"' + extra + '>'
             + '<div class="preview"><img src="' + G_EMPTY + '" id="img_' + id + '" width="' + iw + '" height="' + ih + '"></div>'
             + '<div class="card-info">'
             + '<div class="theme-name">' + t.nombre + '</div>'
             + '<div class="theme-genre" onclick="filtrarPorGenero(\'' + t.safeGenre + '\')">' + t.genero + '</div>'
             + '<a href="' + t.descarga + '" target="_blank" class="download-btn">DESCARGAR</a>'
             + '</div></div>';
    }

    function render() {
        cancelarColas();
        var parts = [];

        if (!esModoAleatorio && !esModoReciente && currentPage===0 && !currentGenre && !trim(searchInput.value)) {
            var n = 0;
            for (var k = 0; k < allThemes.length && n < 2; k++) {
                if (allThemes[k].genero === 'AnimugenZ') { parts.push(crearTarjeta(allThemes[k],'dest_'+n,true)); n++; }
            }
        }

        var start = currentPage * PAGE_SIZE;
        var end   = Math.min(start + PAGE_SIZE, filteredThemes.length);
        for (var i = start; i < end; i++) parts.push(crearTarjeta(filteredThemes[i], i, false));

        grid.innerHTML   = parts.length ? parts.join('') : '<div style="padding:40px;">No se encontraron resultados.</div>';
        statsDiv.innerHTML = filteredThemes.length + ' Temas';
        parts = null;

        dibujarPaginacion();
        imgTimer = setTimeout(procesarColaImagenes, isPS3 ? 200 : 80);
    }

    /* ══════════════════════════════════════════════════════════════
       PAGINACION
    ══════════════════════════════════════════════════════════════ */
    function dibujarPaginacion() {
        var total = Math.ceil(filteredThemes.length / PAGE_SIZE);
        pagDiv.innerHTML = '';
        if (total <= 1) return;

        var startP = Math.max(0, currentPage-4), endP = Math.min(total-1, startP+9);
        for (var p = startP; p <= endP; p++) {
            var btn = document.createElement('button');
            btn.className = (p===currentPage) ? 'page-box active' : 'page-box';
            btn.innerHTML = p+1;
            /* FIX PS3: tabIndex explícito para que el joystick pueda
               navegar con las flechas hasta estos botones           */
            btn.tabIndex = 0;
            btn.onclick = (function(pg){
                return function() {
                    currentPage = pg; render();
                    /* Scroll al inicio del área scrolleable */
                    var area = document.getElementsByClassName('ps3-scroll-area')[0];
                    if (area) area.scrollTop = 0; else window.scrollTo(0,0);
                };
            })(p);
            pagDiv.appendChild(btn);
        }
    }

    /* ══════════════════════════════════════════════════════════════
       COLA DE IMAGENES
    ══════════════════════════════════════════════════════════════ */
    function procesarColaImagenes() {
        imgTimer = null;
        while (imageQueue.length > 0 && imgActivos < IMG_PARALLEL) {
            var item = imageQueue.shift();
            var imgEl = document.getElementById(item.id);
            if (!imgEl) continue;
            imgActivos++;
            (function(el, it){
                el.onload = function() {
                    el.onload = null; el.onerror = null; imgActivos--;
                    imgTimer = isPS3 ? setTimeout(procesarColaImagenes, 60) : null;
                    if (!isPS3) procesarColaImagenes();
                };
                el.onerror = function() {
                    el.onload = null; el.onerror = null;
                    proximaCarpeta(el, it.idx, it.name);
                };
                el.src = it.src;
            })(imgEl, item);
        }
    }

    window.proximaCarpeta = function(img, idx, name) {
        var nIdx = idx+1;
        if (nIdx < FOLDERS.length) {
            img.onerror = function() { img.onload=null; img.onerror=null; proximaCarpeta(img,nIdx,name); };
            img.onload  = function() {
                img.onload=null; img.onerror=null; imgActivos--;
                imgTimer = isPS3 ? setTimeout(procesarColaImagenes,60) : null;
                if (!isPS3) procesarColaImagenes();
            };
            img.src = FOLDERS[nIdx]+name;
        } else {
            img.style.display = 'none'; imgActivos--; procesarColaImagenes();
        }
    };

    /* ══════════════════════════════════════════════════════════════
       ACCIONES
    ══════════════════════════════════════════════════════════════ */
    window.modoAleatorio = function() {
        /* Aleatorio cancela modo recientes */
        esModoReciente = false; actualizarRecentBtn();
        esModoAleatorio = true;
        for (var i=filteredThemes.length-1;i>0;i--) {
            var j=Math.floor(Math.random()*(i+1)), tmp=filteredThemes[i];
            filteredThemes[i]=filteredThemes[j]; filteredThemes[j]=tmp;
        }
        currentPage=0; render();
    };

    window.toggleAdulto = function() {
        mostrarAdulto = !mostrarAdulto;
        var btn = document.getElementById('adultBtn');
        btn.innerHTML = mostrarAdulto ? '+18 ON' : '+18 OFF';
        btn.className = mostrarAdulto ? 'sort-btn btn-adult active' : 'sort-btn btn-adult';
        if (!mostrarAdulto && currentGenre!=='') {
            for (var i=0;i<allThemes.length;i++) {
                if (allThemes[i].genero===currentGenre&&allThemes[i].isAdult) { currentGenre=''; break; }
            }
        }
        currentPage=0; construirCacheGeneros(); construirSidebar(); aplicarFiltros();
    };

    window.filtrarPorGenero = function(g) {
        /* Clic en género cancela modo recientes */
        esModoReciente = false; actualizarRecentBtn();
        currentGenre=g; searchInput.value=''; currentPage=0;
        actualizarSidebarActivo(); aplicarFiltros();
    };

    window.volverInicio = function() {
        /* Volver al inicio cancela modo recientes */
        esModoReciente = false; actualizarRecentBtn();
        searchInput.value=''; currentGenre=''; currentPage=0; esModoAleatorio=false;
        actualizarSidebarActivo(); aplicarFiltros();
    };

    /* ── RECIEN AGREGADOS ─────────────────────────────────────── */
    window.toggleReciente = function() {
        esModoReciente = !esModoReciente;
        actualizarRecentBtn();
        /* Al activar: volver a página 0 y re-filtrar en orden inverso */
        currentPage = 0;
        esModoAleatorio = false;
        aplicarFiltros();
    };

    function actualizarRecentBtn() {
        if (!recentBtn) return;
        if (esModoReciente) {
            recentBtn.innerHTML = 'RECIENTES ON';
            recentBtn.className = 'sort-btn btn-recent active';
        } else {
            recentBtn.innerHTML = 'RECIENTES OFF';
            recentBtn.className = 'sort-btn btn-recent';
        }
    }

    /* ══════════════════════════════════════════════════════════════
       LIMPIEZA DE MEMORIA
       Crítico en PS3: previene que el estado corrupto dañe el HEN.
    ══════════════════════════════════════════════════════════════ */
    window.onbeforeunload = function() {
        cancelarColas();
        if (grid)      grid.innerHTML      = '';
        if (pagDiv)    pagDiv.innerHTML    = '';
        if (genreList) genreList.innerHTML = '';
        if (allThemes)      { allThemes.length=0;      allThemes=null; }
        if (filteredThemes) { filteredThemes.length=0;  filteredThemes=null; }
        if (genresCache)    { genresCache.length=0;     genresCache=null; }
        if (imageQueue)     { imageQueue.length=0;      imageQueue=null; }
        grid=pagDiv=statsDiv=searchInput=genreList=genreBtn=recentBtn=null;
    };

    /* ══════════════════════════════════════════════════════════════
       ARRANQUE
    ══════════════════════════════════════════════════════════════ */
    setTimeout(cargarJSON, isPS3 ? 800 : 500);
</script>
</body>
