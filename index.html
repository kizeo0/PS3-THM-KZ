<script>
    var JSON_URL = 'temas_ps3_conlinks.json';
    
    // Lista de carpetas. Solo añade el link de GitHub en las comillas vacías cuando los tengas.
    var PREVIEW_FOLDERS = [
        'previews1/',                                                               // Índice 0
        'previews2/',                                                               // Índice 1
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud/main/previews3/',   // Índice 2 (GitHub)
        '', // Espacio para preview4 (Índice 3)
        '', // Espacio para preview5 (Índice 4)
        '', // Espacio para preview6 (Índice 5)
        '', // Espacio para preview7 (Índice 6)
        '', // Espacio para preview8 (Índice 7)
        '', // Espacio para preview9 (Índice 8)
        ''  // Espacio para preview10 (Índice 9)
    ];

    var PAGE_SIZE = 16;
    var allThemes = [];
    var filteredThemes = [];
    var currentSort = 'none';
    var currentPage = 0;
    var currentGenre = '';

    var grid = document.getElementById('themeGrid');
    var statsDiv = document.getElementById('stats');
    var loadMoreContainer = document.getElementById('loadMoreContainer');
    var searchInput = document.getElementById('searchInput');

    // Función compatible con PS3 para intentar cargar imagen de otra carpeta si falla
    window.intentarSiguiente = function(imgElement, currentIndex, imgName) {
        var nextIndex = currentIndex + 1;
        if (nextIndex < PREVIEW_FOLDERS.length && PREVIEW_FOLDERS[nextIndex] !== "") {
            imgElement.src = PREVIEW_FOLDERS[nextIndex] + imgName;
            imgElement.onerror = function() { 
                window.intentarSiguiente(imgElement, nextIndex, imgName); 
            };
        } else {
            imgElement.style.display = 'none';
        }
    };

    // Carga de datos compatible con el navegador de PS3
    var xhr = new XMLHttpRequest();
    xhr.open('GET', JSON_URL, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                allThemes.push({
                    archivo: item.archivo,
                    descarga: item.descarga,
                    genero: item.genero || 'Otro',
                    nombre: item.archivo.replace(/\.p3t$/i, ''),
                    // Si el JSON no tiene preview_idx, usamos 0 por defecto
                    p_idx: (item.preview_idx !== undefined) ? item.preview_idx : 0
                });
            }
            filteredThemes = allThemes.slice();
            render(true);
        }
    };
    xhr.send();

    function render(reset) {
        if (reset) { grid.innerHTML = ''; }
        var start = currentPage * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, filteredThemes.length);
        var html = '';

        for (var i = start; i < end; i++) {
            var t = filteredThemes[i];
            var imgName = encodeURI(t.nombre + '.png').replace(/'/g, "%27");
            
            // Determinar carpeta inicial
            var folderBase = PREVIEW_FOLDERS[t.p_idx] || PREVIEW_FOLDERS[0];

            html += '<div class="theme-card">' +
                        '<div class="preview">' +
                            '<img src="' + folderBase + imgName + '" ' +
                            'onerror="window.intentarSiguiente(this, ' + t.p_idx + ', \'' + imgName + '\')">' +
                        '</div>' +
                        '<div class="card-info">' +
                            '<div class="theme-name">' + t.nombre + '</div>' +
                            '<div class="theme-genre" onclick="filtrarPorGenero(\'' + t.genero.replace(/'/g, "\\'") + '\')">' + t.genero + '</div>' +
                            '<a href="' + t.descarga + '" class="download-btn">Descargar</a>' +
                        '</div>' +
                    '</div>';
        }

        if (reset) { grid.innerHTML = html; } else { grid.innerHTML += html; }
        statsDiv.innerHTML = filteredThemes.length + ' temas';
        loadMoreContainer.style.display = (end < filteredThemes.length) ? 'block' : 'none';
    }

    // Mantén el resto de tus funciones (buscarTemas, filtrarPorGenero, etc.) igual que las tenías originalmente
</script>
