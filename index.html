<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 · temas p3t</title>
    <style>
        /* RESET SEGURO PARA PS3 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            line-height: 1.5;
            padding: 20px 0;
            min-height: 100vh;
            text-align: center; /* Centra todo horizontalmente */
        }

        /* Contenedor principal: ancho fijo de 1200px para que quepan 4 tarjetas de 290px con márgenes */
        .main-container {
            width: 1400px;
            margin: 0 auto;
            text-align: left;
        }

        /* CABECERA GRANDE: título a la izquierda, iconos a la derecha */
        .header {
            overflow: hidden; /* Contiene los floats */
            margin-bottom: 30px;
            border-bottom: 4px solid #ff6b35; /* Más grueso */
            padding-bottom: 20px;
        }

        .logo-img {
            height: 100px;          /* Mucho más grande */
            width: auto;
            filter: drop-shadow(0 0 10px #ff6b35);
            float: left;
            display: block;
        }

        .social-container {
            float: right;
            background: #0a1a2a;
            padding: 10px 30px;     /* Más padding */
            border-radius: 60px;
            border: 2px solid #ff6b35;
        }

        .social-icon {
            width: 64px;             /* Iconos más grandes */
            height: 64px;
            background: #0a1a2a;
            border-radius: 18px;
            padding: 8px;
            display: inline-block;
            vertical-align: middle;
        }

        /* BARRA DE HERRAMIENTAS (sin cambios importantes) */
        .toolbar {
            background: #0a1a2a;
            padding: 16px 25px;
            border-radius: 60px;
            margin: 0 0 30px 0;      /* Sin márgenes laterales para aprovechar todo el ancho */
            border-left: 5px solid #ff6b35;
            box-shadow: 0 10px 20px #00000080;
            overflow: hidden;
        }

        .search-wrapper {
            float: left;
            white-space: nowrap;
        }

        .search-wrapper input {
            width: 250px;
            padding: 14px 18px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            vertical-align: middle;
        }

        .dice-btn {
            display: inline-block;
            width: 52px;
            height: 52px;
            margin-left: 8px;
            background: #1e3b4f;
            border: 2px solid #ff6b35;
            border-radius: 50%;
            text-align: center;
            line-height: 52px;
            cursor: pointer;
            vertical-align: middle;
        }

        .dice-img {
            width: 32px;
            height: 32px;
            vertical-align: middle;
        }

        .sort-buttons {
            float: left;
            margin-left: 20px;
        }

        .sort-btn {
            background: transparent;
            border: 2px solid #1e3b4f;
            color: #c9d9e8;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            margin-right: 8px;
        }

        .sort-btn.active {
            background: #ff6b35;
            color: #0b0f17;
        }

        .stats {
            float: right;
            color: #9ab8d9;
            line-height: 52px;
        }

        /* CUADRÍCULA: 4 COLUMNAS CON TARJETAS DE 290px */
        .grid {
            margin: 20px 0;
            font-size: 0;           /* Elimina espacios entre inline-block */
            text-align: center;
        }

        .theme-card {
            width: 290px;            /* Reducido para que quepan 4 */
            background: #0e1727;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1f3a4c;
            display: inline-block;
            vertical-align: top;
            margin: 5px;              /* Margen de 5px a cada lado */
            font-size: 16px;
            text-align: left;
            box-shadow: 0 10px 18px #00000080;
        }

        /* PREVIEW GRANDE (300px de alto) */
        .preview {
            width: 100%;
            background: #03070f;
            text-align: center;
            border-bottom: 3px solid #ff6b35;
            height: 300px;
            line-height: 300px;       /* Centrado vertical de la imagen */
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;
            vertical-align: middle;
        }

        .card-info {
            padding: 18px 15px;
        }

        .theme-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
            height: 2.8em;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .theme-genre {
            background: #122b3b;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #ffb28c;
            margin-bottom: 18px;
            display: inline-block;
            border: 1px solid #ff6b3540;
        }

        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: bold;
            padding: 14px;
            border-radius: 50px;
            text-align: center;
            display: block;
            text-transform: uppercase;
            border-bottom: 4px solid #a03d1e;
        }

        .load-more {
            text-align: center;
            margin: 30px 0;
            clear: both;
        }

        .btn-primary {
            background: #ff6b35;
            color: #0b0f17;
            padding: 15px 60px;
            border-radius: 60px;
            font-weight: bold;
            border: 2px solid #ff9f7b;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* PIE DE PÁGINA MÁS GRANDE */
        .footer {
            margin: 60px 0 30px 0;
            border-top: 3px solid #ff6b3540;
            padding-top: 25px;
            color: #b0c8e0;
            overflow: hidden;
            font-size: 1.4rem;       /* Texto más grande */
        }

        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- CABECERA: título a la izquierda, iconos a la derecha -->
    <div class="header clearfix">
        <img src="recursos/titulo.png" alt="PS3 Themes" class="logo-img" onerror="this.style.display='none'">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos"><img src="recursos/yt.png" alt="YT" class="social-icon" onerror="this.style.display='none'"></a>
            <a href="https://github.com/kizeo0"><img src="recursos/git.png" alt="Git" class="social-icon" onerror="this.style.display='none'"></a>
            <a href="https://x.com/KiZeo0"><img src="recursos/x.png" alt="X" class="social-icon" onerror="this.style.display='none'"></a>
        </div>
    </div>

    <!-- BARRA DE HERRAMIENTAS -->
    <div class="toolbar clearfix">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Buscar tema...">
            <div class="dice-btn" id="randomBtn">
                <img src="recursos/dado.png" alt="D" class="dice-img" onerror="this.style.display='none'">
            </div>
        </div>
        <div class="sort-buttons">
            <button class="sort-btn" id="sortAZ">A-Z</button>
            <button class="sort-btn" id="sortZA">Z-A</button>
        </div>
        <div class="stats" id="stats">...</div>
    </div>

    <!-- CUADRÍCULA DE TEMAS -->
    <div id="themeGrid" class="grid">
        <div style="text-align:center; padding:50px; color:#ffb28c; font-size:20px;">⌛ Cargando temas para PS3...</div>
    </div>

    <!-- BOTÓN CARGAR MÁS -->
    <div class="load-more" id="loadMoreContainer" style="display: none;">
        <button class="btn-primary" id="loadMoreBtn">+ Cargar más temas</button>
    </div>

    <!-- PIE DE PÁGINA -->
    <div class="footer clearfix">
        <span style="float:left">© PS3 · Temas P3T</span>
        <span style="float:right">kizeo0</span>
    </div>
</div>

<script>
    // CONFIGURACIÓN
    var JSON_URL = 'temas_ps3_conlinks.json';
    var PREVIEW_FOLDERS = ['previews1/', 'previews2/'];
    var PAGE_SIZE = 16; // 4 filas de 4 temas = 16 temas por carga

    var allThemes = [];
    var filteredThemes = [];
    var currentSort = 'none';
    var currentPage = 0;

    var grid = document.getElementById('themeGrid');
    var statsDiv = document.getElementById('stats');
    var loadMoreContainer = document.getElementById('loadMoreContainer');

    // CARGA DEL JSON (compatible con PS3)
    var xhr = new XMLHttpRequest();
    xhr.open('GET', JSON_URL, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                try {
                    var data = eval('(' + xhr.responseText + ')');
                    allThemes = data.map(function(item) {
                        return {
                            archivo: item.archivo,
                            descarga: item.descarga,
                            genero: item.genero || 'Otro',
                            nombre: item.archivo.replace(/\.p3t$/i, '')
                        };
                    });
                    aplicarFiltros();
                } catch (e) {
                    grid.innerHTML = '<div style="color:#ff6b35; padding:20px;">Error al procesar los temas.</div>';
                }
            } else {
                grid.innerHTML = '<div style="color:#ff6b35; padding:20px;">No se pudo cargar la lista de temas.</div>';
            }
        }
    };
    xhr.send();

    // FILTRO BÚSQUEDA Y ORDENACIÓN
    function aplicarFiltros() {
        var search = document.getElementById('searchInput').value.toLowerCase();
        filteredThemes = [];
        for (var i = 0; i < allThemes.length; i++) {
            if (allThemes[i].nombre.toLowerCase().indexOf(search) !== -1) {
                filteredThemes.push(allThemes[i]);
            }
        }

        if (currentSort === 'az') {
            filteredThemes.sort(function(a, b) {
                return a.nombre.localeCompare(b.nombre);
            });
        } else if (currentSort === 'za') {
            filteredThemes.sort(function(a, b) {
                return b.nombre.localeCompare(a.nombre);
            });
        }

        currentPage = 0;
        render(true);
    }

    // RENDERIZADO DE TARJETAS
    function render(reset) {
        if (reset) {
            grid.innerHTML = '';
        }

        var start = currentPage * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, filteredThemes.length);
        var html = '';

        for (var i = start; i < end; i++) {
            var t = filteredThemes[i];
            var img = encodeURI(t.nombre + '.png');

            html += '<div class="theme-card">' +
                        '<div class="preview">' +
                            '<img src="' + PREVIEW_FOLDERS[0] + img + '" onerror="this.src=\'' + PREVIEW_FOLDERS[1] + img + '\'; this.onerror=function(){this.style.display=\'none\';}">' +
                        '</div>' +
                        '<div class="card-info">' +
                            '<div class="theme-name">' + t.nombre + '</div>' +
                            '<div class="theme-genre">' + t.genero + '</div>' +
                            '<a href="' + t.descarga + '" class="download-btn">Descargar</a>' +
                        '</div>' +
                    '</div>';
        }

        if (reset) {
            grid.innerHTML = html;
        } else {
            grid.innerHTML += html;
        }

        statsDiv.innerHTML = filteredThemes.length + ' temas';
        loadMoreContainer.style.display = (end < filteredThemes.length) ? 'block' : 'none';
    }

    // EVENTOS
    document.getElementById('loadMoreBtn').onclick = function() {
        currentPage++;
        render(false);
    };

    document.getElementById('searchInput').oninput = aplicarFiltros;

    document.getElementById('sortAZ').onclick = function() {
        currentSort = 'az';
        this.className = 'sort-btn active';
        document.getElementById('sortZA').className = 'sort-btn';
        aplicarFiltros();
    };

    document.getElementById('sortZA').onclick = function() {
        currentSort = 'za';
        this.className = 'sort-btn active';
        document.getElementById('sortAZ').className = 'sort-btn';
        aplicarFiltros();
    };

    document.getElementById('randomBtn').onclick = function() {
        filteredThemes.sort(function() { return 0.5 - Math.random(); });
        currentPage = 0;
        render(true);
    };
</script>
</body>
</html>
