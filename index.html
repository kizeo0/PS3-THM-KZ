<script>
    var JSON_URL = 'temas_ps3_conlinks.json';
    
    // SECCIÓN DE ENLACES: Aquí puedes gestionar tus cuentas de GitHub
    var PREVIEW_FOLDERS = [
        'previews1/',                                                                 // Índice 0 (Local)
        'previews2/',                                                                 // Índice 1 (Local)
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud/main/previews3/',    // Índice 2 (GitHub Cloud 1)
        '', // Espacio para preview4 (Índice 3)
        '', // Espacio para preview5 (Índice 4)
        '', // Espacio para preview6 (Índice 5)
        '', // Espacio para preview7 (Índice 6)
        '', // Espacio para preview8 (Índice 7)
        '', // Espacio para preview9 (Índice 8)
        ''  // Espacio para preview10 (Índice 9)
    ];

    var PAGE_SIZE = 16;
    var allThemes = [];
    var filteredThemes = [];
    var currentSort = 'none';
    var currentPage = 0;
    var currentGenre = '';

    var grid = document.getElementById('themeGrid');
    var statsDiv = document.getElementById('stats');
    var loadMoreContainer = document.getElementById('loadMoreContainer');
    var searchInput = document.getElementById('searchInput');

    // Función de ayuda para buscar la imagen en otras carpetas si falla
    function intentarSiguienteCarpeta(imgElement, currentIndex, imgName) {
        var nextIndex = currentIndex + 1;
        // Solo intentamos si hay más carpetas definidas y no están vacías
        if (nextIndex < PREVIEW_FOLDERS.length && PREVIEW_FOLDERS[nextIndex] !== "") {
            imgElement.src = PREVIEW_FOLDERS[nextIndex] + imgName;
            // Si vuelve a fallar, llamamos a esta misma función con el siguiente índice
            imgElement.onerror = function() { 
                intentarSiguienteCarpeta(imgElement, nextIndex, imgName); 
            };
        } else {
            // Si ya no hay más carpetas, ocultamos la imagen
            imgElement.style.display = 'none';
        }
    }

    var xhr = new XMLHttpRequest();
    xhr.open('GET', JSON_URL, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                try {
                    var data = eval('(' + xhr.responseText + ')');
                    allThemes = data.map(function(item) {
                        return {
                            archivo: item.archivo,
                            descarga: item.descarga,
                            genero: item.genero || 'Otro',
                            nombre: item.archivo.replace(/\.p3t$/i, ''),
                            // Capturamos el índice que pone tu script de Python
                            preview_idx: (item.preview_idx !== undefined) ? item.preview_idx : 0
                        };
                    });
                    filteredThemes = allThemes.slice();
                    render(true);
                } catch (e) {
                    grid.innerHTML = '<div style="color:#ff6b35; padding:20px;">Error al procesar el archivo de temas.</div>';
                }
            }
        }
    };
    xhr.send();

    function render(reset) {
        if (reset) { grid.innerHTML = ''; }
        var start = currentPage * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, filteredThemes.length);
        var html = '';

        for (var i = start; i < end; i++) {
            var t = filteredThemes[i];
            var img = encodeURI(t.nombre + '.png').replace(/'/g, "%27");
            
            // Usamos el índice específico del tema o el 0 por defecto
            var startIdx = t.preview_idx;
            var folderBase = PREVIEW_FOLDERS[startIdx] || PREVIEW_FOLDERS[0];

            html += '<div class="theme-card">' +
                        '<div class="preview">' +
                            '<img src="' + folderBase + img + '" ' +
                            'onerror="intentarSiguienteCarpeta(this, ' + startIdx + ', \'' + img + '\')">' +
                        '</div>' +
                        '<div class="card-info">' +
                            '<div class="theme-name">' + t.nombre + '</div>' +
                            '<div class="theme-genre" onclick="filtrarPorGenero(\'' + t.genero.replace(/'/g, "\\'") + '\')">' + t.genero + '</div>' +
                            '<a href="' + t.descarga + '" class="download-btn">Descargar</a>' +
                        '</div>' +
                    '</div>';
        }

        if (reset) { grid.innerHTML = html; } else { grid.innerHTML += html; }
        statsDiv.innerHTML = filteredThemes.length + ' temas';
        loadMoreContainer.style.display = (end < filteredThemes.length) ? 'block' : 'none';
    }

    // ... (El resto de tus funciones como buscarTemas, ordenarAZ, etc. se mantienen igual) ...
</script>
