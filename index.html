<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>PS3 · temas p3t</title>
    <!-- Estilo profesional, fondo oscuro, azul marino y naranja -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0f17;  /* negro azulado profundo */
            color: #e0e5f0;
            line-height: 1.5;
            padding: 20px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* encabezado con logo y créditos */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ff6b35;
            padding-bottom: 15px;
        }

        .logo-area {
            flex: 1;
        }

        .logo-img {
            height: 65px;               /* se ajusta al alto sin distorsión */
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 5px rgba(255, 107, 53, 0.3));
        }

        .social-container {
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0, 15, 30, 0.7);
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #ff6b35;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            object-fit: contain;
            transition: transform 0.2s ease, filter 0.2s;
            border-radius: 12px;
            background: #0a1a2a;
            padding: 4px;
        }

        .social-icon:hover {
            transform: scale(1.08);
            filter: brightness(1.2);
            background: #1a2a3a;
        }

        /* panel de filtros */
        .filter-panel {
            background: #0a1a2a;         /* azul oscuro elegante */
            padding: 20px 20px 18px;
            border-radius: 40px 40px 20px 20px;
            margin-bottom: 40px;
            border-left: 6px solid #ff6b35;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8);
        }

        .filter-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff9f7b;
            margin-bottom: 18px;
            font-weight: 400;
            border-bottom: 1px dashed #ff6b3540;
            padding-bottom: 8px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 8px;
            justify-content: center;
        }

        .filter-btn {
            background: transparent;
            border: 2px solid #1e3b4f;
            color: #c9d9e8;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: capitalize;
            backdrop-filter: blur(2px);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #ff6b35;
            border-color: #ff9f7b;
            color: #0b0f17;
            box-shadow: 0 0 15px #ff6b35;
            font-weight: 700;
        }

        /* contador de temas */
        .stats {
            text-align: right;
            font-size: 0.9rem;
            margin-top: 12px;
            color: #9ab8d9;
        }

        /* cuadrícula de temas */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px 20px;
            justify-content: center;
            margin-top: 20px;
        }

        /* tarjeta de cada tema */
        .theme-card {
            background: #0e1727;
            border-radius: 30px 30px 20px 20px;
            overflow: hidden;
            box-shadow: 0 15px 25px -8px #00000080;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #1f3a4c;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }

        .theme-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 30px -8px #ff6b3540;
            border-color: #ff6b35;
        }

        .preview {
            width: 100%;
            aspect-ratio: 240 / 270;  /* tal como las previews */
            background-color: #03070f;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #ff6b35;
        }

        .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 16px 14px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .theme-name {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 5px black;
        }

        .theme-genre {
            display: inline-block;
            background: #122b3b;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: #ffb28c;
            margin-bottom: 20px;
            align-self: flex-start;
            border: 1px solid #ff6b3540;
        }

        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: 700;
            padding: 12px 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 1px;
            border: 1px solid #ff9f7b;
            transition: background 0.15s, box-shadow 0.15s;
            margin-top: auto;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #a03d1e;
        }

        .download-btn:hover {
            background: #ff8f5f;
            box-shadow: 0 6px 0 #a03d1e, 0 0 20px #ff9f7b;
        }

        /* footer con créditos compactos */
        .footer {
            margin-top: 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #ff6b3540;
            padding-top: 25px;
            font-size: 0.9rem;
            color: #b0c8e0;
        }

        .footer-credits {
            display: flex;
            gap: 30px;
        }

        .footer-credits a {
            color: #ffb08c;
            text-decoration: none;
            border-bottom: 1px dotted #ff6b35;
        }

        /* estado de carga */
        .loading {
            text-align: center;
            padding: 60px;
            color: #ffb28c;
            font-size: 1.4rem;
        }

        /* placeholder si no hay preview */
        .no-preview {
            background: #09121e;
            color: #456f8a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 0.9rem;
            text-align: center;
            padding: 10px;
        }

        /* mensaje sin resultados */
        .no-results {
            text-align: center;
            padding: 50px;
            background: #0a1a2a;
            border-radius: 60px;
            color: #ffb28c;
            border: 2px dashed #ff6b35;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <!-- título.png de recursos, dimensiones originales 3464x515, se escala con height -->
            <img src="recursos/titulo.png" alt="PS3 Themes Collection" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos" target="_blank"><img src="recursos/yt.png" alt="YouTube" class="social-icon"></a>
            <a href="https://github.com/kizeo0" target="_blank"><img src="recursos/git.png" alt="GitHub" class="social-icon"></a>
            <a href="https://x.com/KiZeo0" target="_blank"><img src="recursos/x.png" alt="X" class="social-icon"></a>
        </div>
    </div>

    <div class="filter-panel" id="filterPanel">
        <div class="filter-title">🎯 explorar por género</div>
        <div class="filter-buttons" id="filterButtons">
            <!-- los botones se generan con js -->
        </div>
        <div class="stats" id="themeStats">cargando temas...</div>
    </div>

    <div id="themeGrid" class="grid">
        <div class="loading">🔍 cargando catálogo de temas...</div>
    </div>

    <div class="footer">
        <div>© PS3 · temas p3t · colección personal</div>
        <div class="footer-credits">
            <a href="https://www.youtube.com/@kizeo0/videos" target="_blank">YT</a>
            <a href="https://github.com/kizeo0" target="_blank">Git</a>
            <a href="https://x.com/KiZeo0" target="_blank">X</a>
            <span style="color:#ff6b35;">|</span>
            <span>recursos gráficos: previews1 / previews2</span>
        </div>
    </div>

    <script>
        (function() {
            // ----- compatibilidad PS3 (ES5) -----
            var CARPETA_PREVIEWS = ['previews1/', 'previews2/'];
            var JSON_URL = 'temas_ps3_conlinks.json';
            var grid = document.getElementById('themeGrid');
            var filterDiv = document.getElementById('filterButtons');
            var statsDiv = document.getElementById('themeStats');

            var allThemes = [];              // guardar objetos con géneros separados
            var uniqueGenres = [];

            // Cargar JSON con XMLHttpRequest (más compatible que fetch)
            var xhr = new XMLHttpRequest();
            xhr.open('GET', JSON_URL, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        procesarDatos(data);
                    } catch (e) {
                        grid.innerHTML = '<div class="no-results">❌ error al leer el json</div>';
                    }
                } else if (xhr.readyState === 4) {
                    grid.innerHTML = '<div class="no-results">❌ no se pudo cargar temas_ps3_conlinks.json</div>';
                }
            };
            xhr.send();

            function procesarDatos(temas) {
                // transformar: separar géneros (pueden venir con comas)
                allThemes = temas.map(function(item) {
                    var generoStr = item.genero || 'Otro';
                    // dividir por coma y limpiar
                    var generos = generoStr.split(',').map(function(g) { return g.trim(); }).filter(function(g) { return g !== ''; });
                    if (generos.length === 0) generos = ['sin género'];
                    return {
                        archivo: item.archivo,
                        descarga: item.descarga,
                        generos: generos,
                        generoOriginal: item.genero
                    };
                });

                // extraer todos los géneros únicos (para filtros)
                var genreSet = {};
                allThemes.forEach(function(theme) {
                    theme.generos.forEach(function(g) {
                        genreSet[g] = true;
                    });
                });
                uniqueGenres = Object.keys(genreSet).sort(function(a,b) {
                    return a.localeCompare(b);
                });

                // dibujar botones de filtro
                var filterHtml = '<button class="filter-btn active" data-genre="ALL">🎲 Todos</button>';
                uniqueGenres.forEach(function(g) {
                    filterHtml += '<button class="filter-btn" data-genre="' + encodeURIComponent(g) + '">' + g + '</button>';
                });
                filterDiv.innerHTML = filterHtml;

                // estadísticas
                statsDiv.innerHTML = allThemes.length + ' temas disponibles';

                // mostrar todos inicialmente
                filtrarPorGenero('ALL');

                // agregar eventos a los botones
                var btns = filterDiv.querySelectorAll('.filter-btn');
                for (var i = 0; i < btns.length; i++) {
                    btns[i].addEventListener('click', function(e) {
                        var target = e.target;
                        // quitar active de todos
                        for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
                        target.classList.add('active');
                        var genre = target.getAttribute('data-genre');
                        filtrarPorGenero(genre === 'ALL' ? 'ALL' : decodeURIComponent(genre));
                    });
                }
            }

            function filtrarPorGenero(selectedGenre) {
                var themesFiltrados = [];
                if (selectedGenre === 'ALL') {
                    themesFiltrados = allThemes.slice(); // todos
                } else {
                    themesFiltrados = allThemes.filter(function(theme) {
                        // algún género coincide exactamente
                        return theme.generos.some(function(g) { return g === selectedGenre; });
                    });
                }

                // actualizar estadística
                statsDiv.innerHTML = themesFiltrados.length + ' temas · filtro: ' + (selectedGenre === 'ALL' ? 'todos' : selectedGenre);

                // renderizar tarjetas
                renderizarTemas(themesFiltrados);
            }

            function renderizarTemas(temas) {
                if (!temas || temas.length === 0) {
                    grid.innerHTML = '<div class="no-results">✨ no hay temas con ese género</div>';
                    return;
                }

                var html = '';
                for (var i = 0; i < temas.length; i++) {
                    var t = temas[i];
                    var nombrePreview = t.archivo.replace(/\.p3t$/i, '') + '.png';
                    // escapamos para el atributo src (lo ponemos literal, el navegador codifica)
                    // pero usamos encodeURI para mayor seguridad en caracteres raros (#, ?, etc)
                    var previewEncoded = encodeURI(nombrePreview);
                    // los nombres pueden tener comillas o símbolos, encodeURI los respeta pero codifica caracteres no ASCII
                    // es más seguro para la petición HTTP
                    var nombreTema = t.archivo.replace(/\.p3t$/i, '');   // sin extensión para mostrar
                    var generosMostrar = t.generos.join(', ');
                    var linkDescarga = t.descarga;

                    // generamos imagen con fallback a previews2
                    // usamos onerror para cambiar src si falla
                    var imgHtml = '<img src="previews1/' + previewEncoded + '" onerror="this.onerror=null; this.src=\'previews2/' + previewEncoded + '\'; this.onerror=function(){this.style.display=\'none\'; this.parentNode.innerHTML+=\'<div class=\\\'no-preview\\\'>sin preview</div>\';}" alt="preview">';

                    html += '<div class="theme-card">' +
                        '<div class="preview">' + imgHtml + '</div>' +
                        '<div class="card-info">' +
                        '<div class="theme-name">' + nombreTema + '</div>' +
                        '<div class="theme-genre">' + generosMostrar + '</div>' +
                        '<a href="' + linkDescarga + '" class="download-btn" target="_blank">⬇ descargar</a>' +
                        '</div></div>';
                }
                grid.innerHTML = html;
            }

            // sobrescribimos onerror globalmente para imágenes (fallback avanzado, pero ya está en línea)
            // adicional: por si alguna img no carga en previews2, dejamos el onerror anidado.
        })();
    </script>

    <!-- pequeño fix para que los iconos de créditos se vean bien en ps3 (ya están con ancho/alto fijo) -->
    <!-- las previews tienen fallback a ambas carpetas -->
    <!-- todo funciona sin necesidad de reescribir el json -->
</body>
</html>
