<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS3 P3T Themes Repository</title>
    <style>
        /* Paleta de colores: Negro, Azul Oscuro y Naranja */
        body {
            background-color: #00050a; /* Azul casi negro */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Cabecera con Logo */
        header {
            background: linear-gradient(to bottom, #001a33, #00050a);
            padding: 20px;
            border-bottom: 2px solid #ff8c00; /* Detalle naranja */
        }

        .logo-container img {
            max-width: 400px; /* Ajuste del titulo.png 3464x515 */
            height: auto;
            display: block;
        }

        /* Filtros por Género */
        .filter-section {
            padding: 20px;
            background: #001122;
            text-align: center;
        }

        .filter-title {
            color: #ff8c00;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .genre-btn {
            background: #002244;
            color: white;
            border: 1px solid #ff8c00;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .genre-btn:hover, .genre-btn.active {
            background: #ff8c00;
            color: #000;
        }

        /* Contenedor de Temas */
        .themes-grid {
            display: block;
            text-align: center;
            padding: 20px;
        }

        .theme-card {
            display: inline-block;
            vertical-align: top;
            width: 240px;
            margin: 15px;
            background: #0a0a0a;
            border: 1px solid #1a334d;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .theme-card:hover {
            border-color: #ff8c00;
            transform: scale(1.05);
        }

        .preview-img {
            width: 240px;
            height: 270px;
            background-color: #111;
            display: block;
        }

        .theme-info {
            padding: 10px;
            font-size: 14px;
        }

        .theme-name {
            display: block;
            height: 40px;
            overflow: hidden;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-download {
            display: block;
            background: #ff8c00;
            color: #000;
            text-decoration: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 0 0 4px 4px;
        }

        /* Footer y Créditos */
        footer {
            background: #000;
            border-top: 2px solid #ff8c00;
            padding: 40px 20px;
            text-align: center;
            margin-top: 50px;
        }

        .social-container {
            margin-bottom: 20px;
        }

        .social-icon {
            width: 50px; /* Tamaño visualmente cómodo */
            height: 50px;
            margin: 0 15px;
            transition: 0.3s;
        }

        .social-icon:hover {
            opacity: 0.7;
        }

        .credits-text {
            color: #666;
            font-size: 12px;
        }

        /* Compatibilidad PS3: Evitar colapsos */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="recursos/titulo.png" alt="PS3 Themes Repository">
    </div>
</header>

<div class="filter-section">
    <div class="filter-title">Filtrar por Género</div>
    <div id="genre-filters">
        <button class="genre-btn active" onclick="filterThemes('todos')">Todos</button>
        </div>
</div>

<main id="themes-container" class="themes-grid clearfix">
    <p>Cargando temas...</p>
</main>

<footer>
    <div class="social-container">
        <a href="https://www.youtube.com/@kizeo0/videos" target="_blank">
            <img src="recursos/yt.png" alt="YT" class="social-icon">
        </a>
        <a href="https://github.com/kizeo0" target="_blank">
            <img src="recursos/git.png" alt="Git" class="social-icon">
        </a>
        <a href="https://x.com/KiZeo0" target="_blank">
            <img src="recursos/x.png" alt="X" class="social-icon">
        </a>
    </div>
    <p class="credits-text">Desarrollado para la comunidad de PlayStation 3</p>
</footer>

<script>
    var allThemes = [];
    var activeGenre = 'todos';

    // Función para cargar el JSON
    function loadThemes() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'temas_ps3_conlinks.json', true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                allThemes = JSON.parse(xhr.responseText);
                renderFilters();
                renderThemes('todos');
            }
        };
        xhr.send();
    }

    // Extraer géneros únicos y crear botones
    function renderFilters() {
        var genres = [];
        for (var i = 0; i < allThemes.length; i++) {
            var g = allThemes[i].genero;
            if (genres.indexOf(g) === -1) {
                genres.push(g);
            }
        }

        var filterContainer = document.getElementById('genre-filters');
        for (var j = 0; j < genres.length; j++) {
            var btn = document.createElement('button');
            btn.className = 'genre-btn';
            btn.innerHTML = genres[j];
            btn.setAttribute('onclick', "filterThemes('" + genres[j] + "')");
            filterContainer.appendChild(btn);
        }
    }

    // Mostrar temas según el filtro
    function renderThemes(filter) {
        var container = document.getElementById('themes-container');
        container.innerHTML = '';
        
        for (var i = 0; i < allThemes.length; i++) {
            var tema = allThemes[i];
            
            if (filter === 'todos' || tema.genero === filter) {
                var card = document.createElement('div');
                card.className = 'theme-card';
                
                // Limpiar el nombre para buscar la imagen (asumiendo que el JSON tiene el nombre exacto)
                // Se intenta buscar en previews1 o previews2
                var imageName = tema.nombre + ".png";
                
                // NOTA: En la web no se puede "saber" en qué carpeta está sin probar. 
                // Usamos una función simple para asignar la ruta.
                // Si tienes los nombres de las carpetas en el JSON sería ideal, 
                // si no, aquí intentamos una por defecto.
                var previewSrc = "previews1/" + imageName; 

                card.innerHTML = 
                    '<img src="' + previewSrc + '" class="preview-img" onerror="this.src=\'previews2/' + imageName + '\'; this.onerror=null;">' +
                    '<div class="theme-info">' +
                        '<span class="theme-name">' + tema.nombre + '</span>' +
                        '<small style="color:#ff8c00">' + tema.genero + '</small>' +
                    '</div>' +
                    '<a href="' + tema.enlace + '" class="btn-download">DESCARGAR P3T</a>';
                
                container.appendChild(card);
            }
        }
    }

    // Manejar el cambio de filtro
    function filterThemes(genre) {
        var btns = document.getElementsByClassName('genre-btn');
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = 'genre-btn';
            if(btns[i].innerHTML === genre || (genre === 'todos' && btns[i].innerHTML === 'Todos')) {
                btns[i].className = 'genre-btn active';
            }
        }
        renderThemes(genre);
    }

    // Iniciar carga
    window.onload = loadThemes;
</script>

</body>
</html>
