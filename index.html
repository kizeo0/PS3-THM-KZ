<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 · temas p3t (colección)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            line-height: 1.5;
            padding: 20px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* cabecera */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 2px solid #ff6b35;
            padding-bottom: 15px;
        }
        .logo-img {
            height: 65px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 6px #ff6b35);
        }
        .social-container {
            display: flex;
            gap: 18px;
            background: #0a1a2a;
            padding: 6px 20px;
            border-radius: 50px;
            border: 1px solid #ff6b35;
        }
        .social-icon {
            width: 44px;
            height: 44px;
            object-fit: contain;
            transition: transform 0.2s;
            background: #0a1a2a;
            border-radius: 12px;
            padding: 4px;
        }
        .social-icon:hover {
            transform: scale(1.08);
            background: #1f3a4c;
        }
        /* barra de herramientas */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            background: #0a1a2a;
            padding: 16px 25px;
            border-radius: 60px;
            margin-bottom: 15px;
            border-left: 5px solid #ff6b35;
            box-shadow: 0 10px 20px #00000080;
        }
        .search-wrapper {
            flex: 2;
            min-width: 240px;
            display: flex;
            gap: 8px;
        }
        .search-wrapper input {
            flex: 1;
            padding: 14px 18px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .search-wrapper input:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 12px #ff6b35;
        }
        .icon-btn {
            background: #1e3b4f;
            border: 2px solid #ff6b35;
            color: #ffb28c;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.15s;
            line-height: 1;
        }
        .icon-btn:hover {
            background: #ff6b35;
            color: #0b0f17;
            border-color: #ff9f7b;
        }
        .sort-buttons {
            display: flex;
            gap: 8px;
        }
        .sort-btn {
            background: transparent;
            border: 2px solid #1e3b4f;
            color: #c9d9e8;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            min-width: 70px;
        }
        .sort-btn.active {
            background: #ff6b35;
            border-color: #ff9f7b;
            color: #0b0f17;
        }
        .sort-btn:hover {
            background: #1f3a4c;
        }
        /* mensaje de guardado */
        .save-note {
            text-align: left;
            margin: 0 0 20px 10px;
            color: #ffb28c;
            font-size: 1rem;
            background: #0a1a2a;
            padding: 10px 25px;
            border-radius: 60px;
            display: inline-block;
            border-left: 5px solid #ff6b35;
        }
        .save-note strong {
            color: #ffffff;
            background: #1e3b4f;
            padding: 4px 12px;
            border-radius: 40px;
            font-family: monospace;
            margin-left: 10px;
        }
        .filter-indicator {
            background: #122b3b;
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .active-filter {
            color: #ffb28c;
            font-weight: 500;
        }
        .clear-filter {
            background: none;
            border: 2px solid #ff6b35;
            color: #ffb28c;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .clear-filter:hover {
            background: #ff6b35;
            color: #0b0f17;
        }
        /* grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            margin: 20px 0 30px;
        }
        .theme-card {
            background: #0e1727;
            border-radius: 30px 30px 20px 20px;
            overflow: hidden;
            border: 1px solid #1f3a4c;
            box-shadow: 0 10px 18px #00000080;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        .theme-card:hover {
            transform: translateY(-5px);
            border-color: #ff6b35;
            box-shadow: 0 20px 25px #ff6b3530;
        }
        /* preview ajustada para mostrar imagen completa sin recortar */
        .preview {
            width: 100%;
            background: #03070f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            border-bottom: 3px solid #ff6b35;
            height: 200px;           /* altura fija para consistencia */
        }
        .preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }
        .no-preview {
            color: #456f8a;
            font-size: 0.9rem;
            text-align: center;
        }
        .card-info {
            padding: 16px 14px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .theme-name {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 10px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* el género ahora es clickeable */
        .theme-genre {
            background: #122b3b;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #ffb28c;
            margin-bottom: 18px;
            align-self: flex-start;
            border: 1px solid #ff6b3540;
            cursor: pointer;
            transition: 0.1s;
        }
        .theme-genre:hover {
            background: #1e3b4f;
            border-color: #ff6b35;
            color: #ffffff;
        }
        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: 700;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 0.95rem;
            border: 1px solid #ff9f7b;
            box-shadow: 0 4px 0 #a03d1e;
            transition: 0.1s;
            margin-top: auto;
            text-transform: uppercase;
        }
        .download-btn:hover {
            background: #ff8f5f;
            box-shadow: 0 6px 0 #a03d1e, 0 0 15px #ff9f7b;
        }
        .load-more {
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            background: transparent;
            border: 2px solid #ff6b35;
            color: #ffb28c;
            padding: 12px 45px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .btn-primary {
            background: #ff6b35;
            color: #0b0f17;
            border: 2px solid #ff9f7b;
        }
        .btn-primary:hover {
            background: #ff8f5f;
            box-shadow: 0 0 15px #ff6b35;
        }
        .footer {
            margin-top: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #ff6b3540;
            padding-top: 20px;
            color: #b0c8e0;
            font-size: 0.9rem;
        }
        .footer a {
            color: #ffb08c;
            text-decoration: none;
            border-bottom: 1px dotted #ff6b35;
        }
        .loading, .no-results, .error-message {
            text-align: center;
            padding: 50px;
            background: #0a1a2a;
            border-radius: 60px;
            color: #ffb28c;
            grid-column: 1 / -1;
        }
        .error-message {
            color: #ff8a7a;
            border: 2px solid #ff6b35;
        }
        .stats {
            color: #9ab8d9;
            font-size: 0.9rem;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="recursos/titulo.png" alt="PS3 Themes" class="logo-img" onerror="this.style.display='none'">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos" target="_blank"><img src="recursos/yt.png" alt="YT" class="social-icon"></a>
            <a href="https://github.com/kizeo0" target="_blank"><img src="recursos/git.png" alt="Git" class="social-icon"></a>
            <a href="https://x.com/KiZeo0" target="_blank"><img src="recursos/x.png" alt="X" class="social-icon"></a>
        </div>
    </div>

    <!-- Nota de almacenamiento para PS3 -->
    <div class="save-note">
        💾 Guarda los archivos .p3t en <strong>dev_hdd0/themes</strong>
    </div>

    <!-- Barra de herramientas -->
    <div class="toolbar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Buscar tema...">
            <div class="icon-btn" id="randomBtn" title="Temas aleatorios">🎲</div>
        </div>
        <div class="sort-buttons">
            <button class="sort-btn" id="sortAZ">A-Z</button>
            <button class="sort-btn" id="sortZA">Z-A</button>
        </div>
        <div class="filter-indicator" id="filterIndicator" style="display: none;">
            <span class="active-filter" id="activeFilterLabel"></span>
            <button class="clear-filter" id="clearFilterBtn">✕ limpiar</button>
        </div>
        <div class="stats" id="stats">cargando...</div>
    </div>

    <!-- Grid de temas -->
    <div id="themeGrid" class="grid">
        <div class="loading">⌛ cargando temas...</div>
    </div>

    <!-- Botón cargar más -->
    <div class="load-more" id="loadMoreContainer" style="display: none;">
        <button class="btn btn-primary" id="loadMoreBtn">+ cargar más</button>
    </div>

    <div class="footer">
        <span>© PS3 · temas p3t</span>
        <span>
            <a href="https://www.youtube.com/@kizeo0/videos" target="_blank">YouTube</a> · 
            <a href="https://github.com/kizeo0" target="_blank">GitHub</a> · 
            <a href="https://x.com/KiZeo0" target="_blank">X</a>
        </span>
    </div>

    <script>
        (function() { // ES5 compatible, pensado para navegador PS3
            // ------------------------------------------------------------
            // CONFIG
            var JSON_URL = 'temas_ps3_conlinks.json';
            var PREVIEW_FOLDERS = ['previews1/', 'previews2/'];
            var PAGE_SIZE = 20;

            // Variables globales
            var allThemes = [];
            var uniqueGenres = [];
            var filteredThemes = [];
            var currentSort = 'none';
            var currentGenreFilter = null;
            var currentSearch = '';
            var currentPage = 0;

            // Elementos DOM
            var grid = document.getElementById('themeGrid');
            var searchInput = document.getElementById('searchInput');
            var randomBtn = document.getElementById('randomBtn');
            var sortAZ = document.getElementById('sortAZ');
            var sortZA = document.getElementById('sortZA');
            var filterIndicator = document.getElementById('filterIndicator');
            var activeFilterLabel = document.getElementById('activeFilterLabel');
            var clearFilterBtn = document.getElementById('clearFilterBtn');
            var statsDiv = document.getElementById('stats');
            var loadMoreContainer = document.getElementById('loadMoreContainer');
            var loadMoreBtn = document.getElementById('loadMoreBtn');

            // ------------------------------------------------------------
            // Cargar JSON con manejo de errores mejorado
            var xhr = new XMLHttpRequest();
            xhr.open('GET', JSON_URL, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            procesarDatos(data);
                        } catch (e) {
                            mostrarError('El archivo JSON no tiene formato válido. (Error: ' + e.message + ')');
                        }
                    } else {
                        mostrarError('No se pudo cargar el archivo JSON (código ' + xhr.status + ').<br>Verifica que <strong>temas_ps3_conlinks.json</strong> esté en el mismo directorio que este HTML.');
                    }
                }
            };
            xhr.onerror = function() {
                mostrarError('Error de red al intentar cargar el JSON.');
            };
            xhr.send();

            function mostrarError(mensaje) {
                grid.innerHTML = '<div class="error-message">❌ ' + mensaje + '</div>';
                statsDiv.innerText = 'error';
                loadMoreContainer.style.display = 'none';
            }

            // ------------------------------------------------------------
            function procesarDatos(temas) {
                if (!temas || !temas.length) {
                    mostrarError('El archivo JSON está vacío.');
                    return;
                }

                // Construir allThemes
                allThemes = [];
                for (var i = 0; i < temas.length; i++) {
                    var item = temas[i];
                    var nombreMostrar = item.archivo.replace(/\.p3t$/i, '');
                    var generoStr = item.genero || 'Otro';
                    var generos = generoStr.split(',').map(function(g) { return g.trim(); }).filter(function(g) { return g !== ''; });
                    if (generos.length === 0) generos = ['sin género'];
                    allThemes.push({
                        archivo: item.archivo,
                        descarga: item.descarga,
                        generos: generos,
                        nombreMostrar: nombreMostrar
                    });
                }

                // Extraer géneros únicos (no se muestran en panel, pero se usan para filtro)
                var genreMap = {};
                for (var j = 0; j < allThemes.length; j++) {
                    var gens = allThemes[j].generos;
                    for (var k = 0; k < gens.length; k++) {
                        genreMap[gens[k]] = true;
                    }
                }
                uniqueGenres = [];
                for (var g in genreMap) uniqueGenres.push(g);
                uniqueGenres.sort();

                // Inicializar filtros
                aplicarFiltros();

                // Eventos
                searchInput.addEventListener('input', function() {
                    currentSearch = searchInput.value.toLowerCase().trim();
                    aplicarFiltros();
                });

                randomBtn.addEventListener('click', function() {
                    // Aleatorio: seleccionar 20 temas al azar de allThemes (o menos)
                    var randomIndexes = [];
                    var total = allThemes.length;
                    var count = Math.min(20, total);
                    while (randomIndexes.length < count) {
                        var r = Math.floor(Math.random() * total);
                        if (randomIndexes.indexOf(r) === -1) randomIndexes.push(r);
                    }
                    var randomThemes = [];
                    for (var i = 0; i < randomIndexes.length; i++) {
                        randomThemes.push(allThemes[randomIndexes[i]]);
                    }
                    // Desactivar filtros de género y búsqueda
                    currentGenreFilter = null;
                    currentSearch = '';
                    searchInput.value = '';
                    currentSort = 'none';
                    sortAZ.classList.remove('active');
                    sortZA.classList.remove('active');
                    ocultarIndicadorFiltro();
                    // Asignar filteredThemes y resetear página
                    filteredThemes = randomThemes;
                    currentPage = 0;
                    renderizarPagina(true);
                    actualizarStats();
                    actualizarBotonCarga();
                });

                sortAZ.addEventListener('click', function() {
                    currentSort = (currentSort === 'az') ? 'none' : 'az';
                    sortAZ.classList.toggle('active', currentSort === 'az');
                    sortZA.classList.remove('active');
                    aplicarFiltros();
                });

                sortZA.addEventListener('click', function() {
                    currentSort = (currentSort === 'za') ? 'none' : 'za';
                    sortZA.classList.toggle('active', currentSort === 'za');
                    sortAZ.classList.remove('active');
                    aplicarFiltros();
                });

                clearFilterBtn.addEventListener('click', function() {
                    currentGenreFilter = null;
                    ocultarIndicadorFiltro();
                    aplicarFiltros();
                });

                loadMoreBtn.addEventListener('click', function() {
                    cargarMas();
                });
            }

            // Aplica todos los filtros (texto, género) y orden, actualiza filteredThemes y renderiza primera página
            function aplicarFiltros() {
                var resultados = allThemes.slice(); // copia

                // filtro texto
                if (currentSearch !== '') {
                    resultados = resultados.filter(function(t) {
                        return t.nombreMostrar.toLowerCase().indexOf(currentSearch) !== -1;
                    });
                }

                // filtro género
                if (currentGenreFilter !== null) {
                    resultados = resultados.filter(function(t) {
                        return t.generos.indexOf(currentGenreFilter) !== -1;
                    });
                }

                // ordenación
                if (currentSort === 'az') {
                    resultados.sort(function(a, b) {
                        return a.nombreMostrar.localeCompare(b.nombreMostrar);
                    });
                } else if (currentSort === 'za') {
                    resultados.sort(function(a, b) {
                        return b.nombreMostrar.localeCompare(a.nombreMostrar);
                    });
                }

                filteredThemes = resultados;
                currentPage = 0;
                renderizarPagina(true);
                actualizarStats();
                actualizarBotonCarga();
            }

            // Renderiza la página actual (currentPage) en el grid
            function renderizarPagina(reset) {
                if (reset) {
                    grid.innerHTML = '';
                }
                var start = currentPage * PAGE_SIZE;
                var end = Math.min(start + PAGE_SIZE, filteredThemes.length);
                if (filteredThemes.length === 0) {
                    grid.innerHTML = '<div class="no-results">✨ no hay temas con esos criterios</div>';
                    return;
                }
                if (start >= filteredThemes.length) return;

                var html = '';
                for (var i = start; i < end; i++) {
                    var t = filteredThemes[i];
                    var previewName = t.archivo.replace(/\.p3t$/i, '') + '.png';
                    var previewEncoded = encodeURI(previewName);
                    var generosStr = t.generos.join(', ');
                    // imagen con fallback
                    var imgHtml = '<img src="' + PREVIEW_FOLDERS[0] + previewEncoded + '" onerror="this.onerror=null; this.src=\'' + PREVIEW_FOLDERS[1] + previewEncoded + '\'; this.onerror=function(){this.style.display=\'none\'; this.parentNode.innerHTML+=\'<div class=\\\'no-preview\\\'>sin preview</div>\';}" alt="preview">';

                    html += '<div class="theme-card">' +
                        '<div class="preview">' + imgHtml + '</div>' +
                        '<div class="card-info">' +
                        '<div class="theme-name">' + t.nombreMostrar + '</div>' +
                        '<div class="theme-genre" data-genre="' + t.generos[0].replace(/"/g, '&quot;') + '">' + generosStr + '</div>' +
                        '<a href="' + t.descarga + '" class="download-btn" target="_blank">⬇ descargar</a>' +
                        '</div></div>';
                }

                if (reset) {
                    grid.innerHTML = html;
                } else {
                    grid.insertAdjacentHTML('beforeend', html);
                }

                // Añadir eventos click a los géneros (delegación)
                var genreSpans = grid.querySelectorAll('.theme-genre');
                for (var j = 0; j < genreSpans.length; j++) {
                    genreSpans[j].addEventListener('click', function(e) {
                        var genre = this.getAttribute('data-genre');
                        if (genre) {
                            currentGenreFilter = genre;
                            activeFilterLabel.innerText = 'Género: ' + genre;
                            filterIndicator.style.display = 'flex';
                            // No se limpia la búsqueda, pero se podría hacer opcional
                            aplicarFiltros();
                        }
                        e.stopPropagation();
                    });
                }
            }

            function cargarMas() {
                if ((currentPage + 1) * PAGE_SIZE < filteredThemes.length) {
                    currentPage++;
                    renderizarPagina(false);
                }
                actualizarBotonCarga();
            }

            function actualizarBotonCarga() {
                if (filteredThemes.length > (currentPage + 1) * PAGE_SIZE) {
                    loadMoreContainer.style.display = 'block';
                } else {
                    loadMoreContainer.style.display = 'none';
                }
            }

            function actualizarStats() {
                statsDiv.innerText = filteredThemes.length + ' temas';
            }

            function ocultarIndicadorFiltro() {
                filterIndicator.style.display = 'none';
                activeFilterLabel.innerText = '';
            }

        })();
    </script>
</body>
</html>
