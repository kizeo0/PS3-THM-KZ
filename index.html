<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 · temas p3t (colección)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* cabecera */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ff6b35;
            padding-bottom: 15px;
        }
        .logo-img {
            height: 65px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 6px #ff6b35);
        }
        .social-container {
            display: flex;
            gap: 18px;
            background: #0a1a2a;
            padding: 6px 20px;
            border-radius: 50px;
            border: 1px solid #ff6b35;
        }
        .social-icon {
            width: 44px;
            height: 44px;
            object-fit: contain;
            transition: transform 0.2s;
            background: #0a1a2a;
            border-radius: 12px;
            padding: 4px;
        }
        .social-icon:hover {
            transform: scale(1.08);
            background: #1f3a4c;
        }
        /* estructura principal: sidebar + contenido */
        .main-layout {
            display: flex;
            gap: 30px;
            flex: 1;
        }
        /* panel lateral filtros */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #0a1a2a;
            border-radius: 30px;
            padding: 25px 15px;
            border-left: 5px solid #ff6b35;
            box-shadow: 0 15px 25px #00000080;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .filter-header {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffb28c;
            border-bottom: 2px solid #ff6b35;
            padding-bottom: 12px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }
        .search-box {
            margin-bottom: 25px;
        }
        .search-box label {
            display: block;
            color: #ffb28c;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 60px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 12px #ff6b35;
        }
        .genre-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 6px;
            margin-bottom: 20px;
            scrollbar-width: thin;
            scrollbar-color: #ff6b35 #0f2638;
        }
        .genre-list::-webkit-scrollbar {
            width: 6px;
        }
        .genre-list::-webkit-scrollbar-thumb {
            background: #ff6b35;
            border-radius: 10px;
        }
        .genre-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            margin: 2px 0;
            background: #0e1f2e;
            border-radius: 40px;
            border: 1px solid #1e3b4f;
            cursor: pointer;
            transition: 0.1s;
        }
        .genre-item:hover {
            background: #1e3b4f;
            border-color: #ff9f7b;
        }
        .genre-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ff6b35;
            cursor: pointer;
        }
        .genre-item label {
            flex: 1;
            cursor: pointer;
            font-size: 0.95rem;
            color: #d0e0f0;
            text-transform: capitalize;
        }
        .filter-actions {
            display: flex;
            gap: 10px;
            margin: 20px 0 10px;
        }
        .btn {
            background: transparent;
            border: 2px solid #ff6b35;
            color: #ffb28c;
            padding: 10px 0;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            flex: 1;
            text-align: center;
        }
        .btn-primary {
            background: #ff6b35;
            color: #0b0f17;
            border: 2px solid #ff9f7b;
        }
        .btn-primary:hover {
            background: #ff8f5f;
            box-shadow: 0 0 15px #ff6b35;
        }
        .btn:hover {
            background: #1f3a4c;
            color: white;
        }
        .stats-side {
            text-align: center;
            color: #9ab8d9;
            font-size: 0.85rem;
            margin-top: 15px;
        }
        /* contenido derecho */
        .content {
            flex: 1;
            min-width: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .theme-card {
            background: #0e1727;
            border-radius: 30px 30px 20px 20px;
            overflow: hidden;
            border: 1px solid #1f3a4c;
            box-shadow: 0 10px 18px #00000080;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        .theme-card:hover {
            transform: translateY(-5px);
            border-color: #ff6b35;
            box-shadow: 0 20px 25px #ff6b3530;
        }
        .preview {
            width: 100%;
            aspect-ratio: 240 / 270;
            background: #03070f;
            border-bottom: 3px solid #ff6b35;
        }
        .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .no-preview {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #09121e;
            color: #456f8a;
            font-size: 0.8rem;
        }
        .card-info {
            padding: 14px 12px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .theme-name {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .theme-genre {
            background: #122b3b;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #ffb28c;
            margin-bottom: 15px;
            align-self: flex-start;
            border: 1px solid #ff6b3540;
        }
        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: 700;
            padding: 10px;
            border-radius: 50px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid #ff9f7b;
            box-shadow: 0 4px 0 #a03d1e;
            transition: 0.1s;
            margin-top: auto;
            text-transform: uppercase;
        }
        .download-btn:hover {
            background: #ff8f5f;
            box-shadow: 0 6px 0 #a03d1e, 0 0 15px #ff9f7b;
        }
        .load-more {
            text-align: center;
            margin: 30px 0;
        }
        .load-more .btn {
            display: inline-block;
            padding: 12px 45px;
            font-size: 1.1rem;
        }
        .footer {
            margin-top: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #ff6b3540;
            padding-top: 20px;
            color: #b0c8e0;
            font-size: 0.9rem;
        }
        .footer a {
            color: #ffb08c;
            text-decoration: none;
            border-bottom: 1px dotted #ff6b35;
        }
        .loading, .no-results {
            text-align: center;
            padding: 50px;
            background: #0a1a2a;
            border-radius: 60px;
            color: #ffb28c;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="recursos/titulo.png" alt="PS3 Themes" class="logo-img" onerror="this.style.display='none'">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos" target="_blank"><img src="recursos/yt.png" alt="YT" class="social-icon"></a>
            <a href="https://github.com/kizeo0" target="_blank"><img src="recursos/git.png" alt="Git" class="social-icon"></a>
            <a href="https://x.com/KiZeo0" target="_blank"><img src="recursos/x.png" alt="X" class="social-icon"></a>
        </div>
    </div>

    <div class="main-layout">
        <!-- sidebar filtros -->
        <div class="sidebar">
            <div class="filter-header">🔍 filtrar</div>
            <div class="search-box">
                <label>buscar tema</label>
                <input type="text" id="searchInput" placeholder="nombre...">
            </div>
            <div class="genre-list" id="genreContainer">
                <!-- los checkboxes se generan con js -->
            </div>
            <div class="filter-actions">
                <button class="btn" id="clearFilters">limpiar</button>
                <button class="btn btn-primary" id="applyFilters">aplicar</button>
            </div>
            <div class="stats-side" id="sideStats">cargando...</div>
        </div>

        <!-- contenido: grid + cargar más -->
        <div class="content">
            <div id="themeGrid" class="grid">
                <div class="loading">⌛ cargando temas...</div>
            </div>
            <div class="load-more" id="loadMoreContainer" style="display: none;">
                <button class="btn btn-primary" id="loadMoreBtn">+ cargar más</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <span>© PS3 · temas p3t</span>
        <span>
            <a href="https://www.youtube.com/@kizeo0/videos" target="_blank">YouTube</a> · 
            <a href="https://github.com/kizeo0" target="_blank">GitHub</a> · 
            <a href="https://x.com/KiZeo0" target="_blank">X</a>
        </span>
    </div>

    <script>
        (function() { // todo ES5 compatible
            // --------------------------------------------------------------
            // CONFIG
            var JSON_URL = 'temas_ps3_conlinks.json';
            var PREVIEW_FOLDERS = ['previews1/', 'previews2/'];
            var PAGE_SIZE = 20;

            // Variables globales
            var allThemes = [];                 // {archivo, descarga, generos[], nombreMostrar}
            var uniqueGenres = [];
            var generosSeleccionados = [];      // array de géneros seleccionados (strings)
            var filtroTexto = '';
            var resultadosFiltrados = [];        // temas tras filtros (sin paginar)
            var paginaActual = 0;

            // Elementos DOM
            var grid = document.getElementById('themeGrid');
            var genreContainer = document.getElementById('genreContainer');
            var searchInput = document.getElementById('searchInput');
            var clearBtn = document.getElementById('clearFilters');
            var applyBtn = document.getElementById('applyFilters');
            var loadMoreBtn = document.getElementById('loadMoreBtn');
            var loadMoreContainer = document.getElementById('loadMoreContainer');
            var sideStats = document.getElementById('sideStats');

            // --------------------------------------------------------------
            // Cargar JSON
            var xhr = new XMLHttpRequest();
            xhr.open('GET', JSON_URL, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        procesarDatos(data);
                    } catch (e) {
                        grid.innerHTML = '<div class="no-results">❌ error en JSON</div>';
                    }
                } else if (xhr.readyState === 4) {
                    grid.innerHTML = '<div class="no-results">❌ no se encontró ' + JSON_URL + '</div>';
                }
            };
            xhr.send();

            // --------------------------------------------------------------
            function procesarDatos(temas) {
                // construir allThemes con géneros separados
                allThemes = [];
                for (var i = 0; i < temas.length; i++) {
                    var item = temas[i];
                    var nombreMostrar = item.archivo.replace(/\.p3t$/i, '');
                    var generoStr = item.genero || 'Otro';
                    var generos = generoStr.split(',').map(function(g) { return g.trim(); }).filter(function(g) { return g !== ''; });
                    if (generos.length === 0) generos = ['sin género'];
                    allThemes.push({
                        archivo: item.archivo,
                        descarga: item.descarga,
                        generos: generos,
                        nombreMostrar: nombreMostrar,
                        generoOriginal: item.genero
                    });
                }

                // extraer géneros únicos
                var genreMap = {};
                for (var j = 0; j < allThemes.length; j++) {
                    var gens = allThemes[j].generos;
                    for (var k = 0; k < gens.length; k++) {
                        genreMap[gens[k]] = true;
                    }
                }
                uniqueGenres = [];
                for (var g in genreMap) {
                    if (genreMap.hasOwnProperty(g)) uniqueGenres.push(g);
                }
                uniqueGenres.sort(function(a, b) { return a.localeCompare(b); });

                // dibujar checkboxes
                dibujarCheckboxes();

                // estadísticas iniciales
                actualizarSideStats(allThemes.length, allThemes.length);

                // aplicar filtros (vacíos) y cargar primera página
                aplicarFiltrosYActualizar();

                // eventos
                searchInput.addEventListener('input', function() {
                    // podríamos aplicar automáticamente o con botón. mejor con botón aplicar.
                });
                applyBtn.addEventListener('click', function() {
                    recogerSeleccionCheckboxes();
                    aplicarFiltrosYActualizar();
                });
                clearBtn.addEventListener('click', function() {
                    // desmarcar todos los checkboxes
                    var checkboxes = genreContainer.querySelectorAll('input[type="checkbox"]');
                    for (var i = 0; i < checkboxes.length; i++) {
                        checkboxes[i].checked = false;
                    }
                    generosSeleccionados = [];
                    searchInput.value = '';
                    filtroTexto = '';
                    aplicarFiltrosYActualizar();
                });
                loadMoreBtn.addEventListener('click', function() {
                    cargarMas();
                });
            }

            function dibujarCheckboxes() {
                var html = '';
                for (var i = 0; i < uniqueGenres.length; i++) {
                    var gen = uniqueGenres[i];
                    html += '<div class="genre-item">' +
                        '<input type="checkbox" id="chk_' + i + '" value="' + gen.replace(/"/g, '&quot;') + '">' +
                        '<label for="chk_' + i + '">' + gen + '</label>' +
                        '</div>';
                }
                genreContainer.innerHTML = html;
            }

            function recogerSeleccionCheckboxes() {
                var checkboxes = genreContainer.querySelectorAll('input[type="checkbox"]');
                generosSeleccionados = [];
                for (var i = 0; i < checkboxes.length; i++) {
                    if (checkboxes[i].checked) {
                        generosSeleccionados.push(checkboxes[i].value);
                    }
                }
                filtroTexto = searchInput.value.toLowerCase().trim();
            }

            // filtra allThemes según generosSeleccionados y filtroTexto
            function filtrarTemas() {
                if (!allThemes.length) return [];
                return allThemes.filter(function(tema) {
                    // filtro texto: buscar en nombreMostrar (sin extensión)
                    if (filtroTexto !== '') {
                        var nombre = tema.nombreMostrar.toLowerCase();
                        if (nombre.indexOf(filtroTexto) === -1) return false;
                    }
                    // filtro géneros: si hay selección, el tema debe tener al menos uno
                    if (generosSeleccionados.length > 0) {
                        var tieneGenero = false;
                        for (var i = 0; i < generosSeleccionados.length; i++) {
                            if (tema.generos.indexOf(generosSeleccionados[i]) !== -1) {
                                tieneGenero = true;
                                break;
                            }
                        }
                        return tieneGenero;
                    }
                    return true; // sin filtro de género
                });
            }

            function aplicarFiltrosYActualizar() {
                recogerSeleccionCheckboxes(); // asegurar que lee los checks
                resultadosFiltrados = filtrarTemas();
                paginaActual = 0;
                renderizarPagina(true); // reset grid
                actualizarSideStats(resultadosFiltrados.length, allThemes.length);
                // mostrar/ocultar botón cargar más
                if (resultadosFiltrados.length > PAGE_SIZE) {
                    loadMoreContainer.style.display = 'block';
                } else {
                    loadMoreContainer.style.display = 'none';
                }
            }

            function renderizarPagina(reset) {
                if (reset) {
                    grid.innerHTML = '';
                }
                var inicio = paginaActual * PAGE_SIZE;
                var fin = Math.min(inicio + PAGE_SIZE, resultadosFiltrados.length);
                if (inicio >= resultadosFiltrados.length) {
                    if (paginaActual === 0) grid.innerHTML = '<div class="no-results">🎯 no hay temas con esos filtros</div>';
                    return;
                }

                var html = '';
                for (var i = inicio; i < fin; i++) {
                    var t = resultadosFiltrados[i];
                    var nombrePreview = t.archivo.replace(/\.p3t$/i, '') + '.png';
                    var previewEncoded = encodeURI(nombrePreview);
                    var generosStr = t.generos.join(', ');
                    // imagen con fallback
                    var imgHtml = '<img src="' + PREVIEW_FOLDERS[0] + previewEncoded + '" onerror="this.onerror=null; this.src=\'' + PREVIEW_FOLDERS[1] + previewEncoded + '\'; this.onerror=function(){this.style.display=\'none\'; this.parentNode.innerHTML+=\'<div class=\\\'no-preview\\\'>sin preview</div>\';}" alt="preview">';

                    html += '<div class="theme-card">' +
                        '<div class="preview">' + imgHtml + '</div>' +
                        '<div class="card-info">' +
                        '<div class="theme-name">' + t.nombreMostrar + '</div>' +
                        '<div class="theme-genre">' + generosStr + '</div>' +
                        '<a href="' + t.descarga + '" class="download-btn" target="_blank">⬇ descargar</a>' +
                        '</div></div>';
                }

                if (reset) {
                    grid.innerHTML = html;
                } else {
                    grid.insertAdjacentHTML('beforeend', html);
                }

                // actualizar botón cargar más
                if (fin >= resultadosFiltrados.length) {
                    loadMoreContainer.style.display = 'none';
                } else {
                    loadMoreContainer.style.display = 'block';
                }
            }

            function cargarMas() {
                if (paginaActual * PAGE_SIZE < resultadosFiltrados.length) {
                    paginaActual++;
                    renderizarPagina(false);
                }
            }

            function actualizarSideStats(mostrados, totales) {
                sideStats.innerHTML = mostrados + ' temas · total ' + totales;
            }

        })();
    </script>
</body>
</html>
