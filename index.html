<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 Themes Collection</title>
    <style>
        /* Estilos generales - Compatibles con PS3 NetFront */
        body {
            background-color: #000000; /* Negro */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(to bottom, #000022, #000000);
        }

        /* Cabecera */
        #header {
            background-color: #000033; /* Azul oscuro */
            border-bottom: 3px solid #ff6600; /* Naranja */
            padding: 10px;
            height: 80px;
            overflow: hidden;
        }

        .logo {
            float: left;
            height: 60px; /* Escalado para el navegador */
            width: auto;
        }

        /* Apartado de Géneros */
        #filter-section {
            background: #00001a;
            padding: 15px;
            border-bottom: 1px solid #ff6600;
            text-align: center;
        }

        .genre-box {
            display: inline-block;
            margin: 5px 10px;
            background: #000044;
            padding: 5px 10px;
            border: 1px solid #333;
            cursor: pointer;
            color: #ff6600;
            font-size: 14px;
        }

        .genre-box:hover {
            background: #ff6600;
            color: #000;
        }

        /* Contenedor de Temas */
        #themes-container {
            padding: 20px;
            text-align: center;
        }

        .theme-card {
            display: inline-block;
            width: 250px;
            margin: 15px;
            background: #111;
            border: 2px solid #000066;
            vertical-align: top;
            padding: 10px;
            text-decoration: none;
            color: white;
            transition: border-color 0.3s;
        }

        .theme-card:hover {
            border-color: #ff6600;
        }

        .preview-img {
            width: 240px;
            height: 270px;
            background: #222;
            border: 1px solid #333;
        }

        .theme-title {
            font-size: 14px;
            margin: 10px 0;
            height: 40px;
            overflow: hidden;
            font-weight: bold;
            display: block;
        }

        .btn-download {
            display: block;
            background: #ff6600;
            color: #000;
            padding: 8px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Créditos y Social */
        .footer {
            background: #000022;
            border-top: 2px solid #ff6600;
            padding: 30px;
            text-align: center;
            margin-top: 50px;
        }

        .social-container {
            margin-bottom: 20px;
        }

        .social-icon {
            width: 60px; /* Tamaño ajustado para visibilidad */
            height: 60px;
            margin: 0 15px;
            border: 2px solid transparent;
        }

        .social-icon:hover {
            border-color: #ff6600;
        }

        .credits-text {
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="header">
        <img src="recursos/titulo.png" alt="PS3 Themes" class="logo">
    </div>

    <div id="filter-section">
        <strong style="color: white; margin-right: 20px;">FILTRAR POR GÉNERO:</strong>
        <div id="genres-list" style="display: inline-block;">
            <span class="genre-box" onclick="filterThemes('all')">TODOS</span>
            </div>
    </div>

    <div id="themes-container">
        <p>Cargando temas...</p>
    </div>

    <div class="footer">
        <div class="social-container"> 
            <a href="https://www.youtube.com/@kizeo0/videos" target="_blank">
                <img src="recursos/yt.png" alt="YT" class="social-icon">
            </a> 
            <a href="https://github.com/kizeo0" target="_blank">
                <img src="recursos/git.png" alt="Git" class="social-icon">
            </a> 
            <a href="https://x.com/KiZeo0" target="_blank">
                <img src="recursos/x.png" alt="X" class="social-icon">
            </a> 
        </div>
        <p class="credits-text">Recopilación de temas P3T para PlayStation 3 - KiZeo0 &copy; 2024</p>
    </div>

    <script type="text/javascript">
        var allThemes = [];
        var container = document.getElementById('themes-container');
        var genreContainer = document.getElementById('genres-list');

        // Cargar JSON
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'temas_ps3_conlinks.json', true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                allThemes = JSON.parse(xhr.responseText);
                renderGenres();
                renderThemes(allThemes);
            }
        };
        xhr.send();

        // Extraer y mostrar géneros únicos
        function renderGenres() {
            var genres = {};
            for (var i = 0; i < allThemes.length; i++) {
                var g = allThemes[i].genero;
                if (g) genres[g] = true;
            }
            
            for (var key in genres) {
                var span = document.createElement('span');
                span.className = 'genre-box';
                span.innerHTML = key.toUpperCase();
                span.setAttribute('onclick', "filterThemes('" + key + "')");
                genreContainer.appendChild(span);
            }
        }

        // Filtrar temas
        function filterThemes(genre) {
            if (genre === 'all') {
                renderThemes(allThemes);
            } else {
                var filtered = [];
                for (var i = 0; i < allThemes.length; i++) {
                    if (allThemes[i].genero === genre) {
                        filtered.push(allThemes[i]);
                    }
                }
                renderThemes(filtered);
            }
        }

        // Mostrar temas en pantalla
        function renderThemes(themes) {
            container.innerHTML = '';
            if (themes.length === 0) {
                container.innerHTML = '<p>No se encontraron temas.</p>';
                return;
            }

            for (var i = 0; i < themes.length; i++) {
                var item = themes[i];
                // El nombre de la preview es el nombre del archivo sin .p3t mas .png
                var imgName = item.archivo.replace('.p3t', '.png');
                
                var card = document.createElement('div');
                card.className = 'theme-card';
                
                // Lógica de fallback para carpetas previews1 y previews2
                var imgHtml = '<img src="previews1/' + imgName + '" class="preview-img" ' +
                              'onerror="if (this.src.indexOf(\'previews1\') != -1) this.src=\'previews2/' + imgName + '\';">';

                card.innerHTML = imgHtml + 
                                 '<span class="theme-title">' + item.archivo + '</span>' +
                                 '<a href="' + item.descarga + '" class="btn-download">DESCARGAR</a>';
                
                container.appendChild(card);
            }
        }
    </script>
</body>
</html>
