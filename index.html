<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 THM KZ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            padding: 20px 0;
            text-align: center;
        }

        .main-container {
            width: 1400px; /* Ancho extendido solicitado */
            margin: 0 auto;
            text-align: left;
        }

        .header {
            overflow: hidden;
            margin-bottom: 30px;
            border-bottom: 4px solid #ff6b35;
            padding-bottom: 20px;
        }

        .logo-img {
            height: 100px;
            float: left;
            cursor: pointer;
        }

        .social-container {
            float: right;
            background: #0a1a2a;
            padding: 10px 30px;
            border-radius: 60px;
            border: 2px solid #ff6b35;
        }

        .social-icon {
            width: 64px;
            height: 64px;
            margin: 0 5px;
            vertical-align: middle;
        }

        .toolbar {
            background: #0a1a2a;
            padding: 16px 25px;
            border-radius: 60px;
            margin-bottom: 30px;
            border-left: 5px solid #ff6b35;
            overflow: hidden;
        }

        .search-wrapper { float: left; }

        .search-wrapper input {
            width: 250px;
            padding: 14px 18px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 60px;
            color: white;
            vertical-align: middle;
        }

        .dice-btn {
            display: inline-block;
            width: 52px;
            height: 52px;
            margin-left: 8px;
            background: #1e3b4f;
            border: 2px solid #ff6b35;
            border-radius: 50%;
            text-align: center;
            line-height: 52px;
            cursor: pointer;
            vertical-align: middle;
        }

        .dice-img { width: 32px; vertical-align: middle; }

        .sort-buttons { float: left; margin-left: 20px; }

        .sort-btn {
            background: transparent;
            border: 2px solid #1e3b4f;
            color: #c9d9e8;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 8px;
        }

        .sort-btn.active { background: #ff6b35; color: #0b0f17; }

        /* Botón de género activo */
        .btn-genre-active {
            background: #1e3b4f;
            border-color: #ffb28c;
            color: #ffb28c;
            display: none;
        }

        .btn-adult { border-color: #ff3535; color: #ff9b9b; }
        .btn-adult.active { background: #ff3535; color: white; }

        .stats { float: right; color: #9ab8d9; line-height: 52px; }

        .grid { text-align: center; }

        .theme-card {
            width: 290px;
            background: #0e1727;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1f3a4c;
            display: inline-block;
            vertical-align: top;
            margin: 15px;
            text-align: left;
        }

        .preview {
            width: 100%;
            background: #03070f;
            text-align: center;
            border-bottom: 3px solid #ff6b35;
            height: 250px;
            line-height: 250px;
        }

        .preview img { max-width: 100%; max-height: 100%; vertical-align: middle; }

        .card-info { padding: 18px 15px; }

        .theme-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
            height: 2.8em;
            overflow: hidden;
        }

        .theme-genre {
            background: #122b3b;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #ffb28c;
            margin: 10px 0;
            display: inline-block;
            border: 1px solid #ff6b3540;
            cursor: pointer;
        }

        .theme-genre:hover { border-color: #ff6b35; background: #1e3f55; }

        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: bold;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            display: block;
        }

        .load-more { text-align: center; margin: 30px 0; clear: both; }

        .btn-primary {
            background: #ff6b35;
            color: #0b0f17;
            padding: 15px 60px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            margin-top: 60px;
            border-top: 3px solid #ff6b3540;
            padding: 25px 0;
            color: #b0c8e0;
            font-size: 1.2rem;
        }

        .clearfix::after { content: ""; display: table; clear: both; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header clearfix">
        <img src="recursos/titulo.png" alt="PS3" class="logo-img" onclick="volverInicio()">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos"><img src="recursos/yt.png" class="social-icon"></a>
            <a href="https://github.com/kizeo0"><img src="recursos/git.png" class="social-icon"></a>
            <a href="https://x.com/KiZeo0"><img src="recursos/x.png" class="social-icon"></a>
        </div>
    </div>

    <div class="toolbar clearfix">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="buscarTemas()">
            <div class="dice-btn" onclick="modoAleatorio()">
                <img src="recursos/dado.png" class="dice-img">
            </div>
        </div>
        <div class="sort-buttons">
            <button class="sort-btn" id="sortAZ" onclick="ordenarAZ()">A-Z</button>
            <button class="sort-btn" id="sortZA" onclick="ordenarZA()">Z-A</button>
            <button class="sort-btn btn-adult" id="adultBtn" onclick="toggleAdulto()">+18 OFF</button>
            <button class="sort-btn btn-genre-active" id="genreActiveBtn" onclick="volverInicio()"></button>
        </div>
        <div class="stats" id="stats">...</div>
    </div>

    <div id="themeGrid" class="grid">
        <div style="padding:50px; color:#ffb28c; font-size:18px;">Cargando temas...</div>
    </div>

    <div class="load-more" id="loadMoreContainer" style="display: none;">
        <button class="btn-primary" onclick="cargarMas()">Ver más temas</button>
    </div>

    <div class="footer clearfix">
        <span style="float:left">© PS3 · Temas P3T</span>
        <span style="float:right">kizeo0</span>
    </div>
</div>

<script>
    var JSON_URL = 'temas_ps3_conlinks.json';
    var PAGE_SIZE = 12; 
    var PALABRAS_ADULTO = ['adult', '18+', 'girls/adult', 'girl', 'sexy', 'ecchi', 'hentai', 'babes', 'harem'];
    var PREVIEW_FOLDERS = [
        'previews1/', 'previews2/', 
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud/main/previews3/',
        'https://raw.githubusercontent.com/kizeocloud1/ps3cloud1/main/previews4/'
    ];

    var allThemes = [];
    var filteredThemes = [];
    var currentSort = 'none';
    var currentPage = 0;
    var currentGenre = '';
    var mostrarContenidoAdulto = false;

    var grid = document.getElementById('themeGrid');
    var statsDiv = document.getElementById('stats');
    var loadMoreContainer = document.getElementById('loadMoreContainer');
    var searchInput = document.getElementById('searchInput');
    var adultBtn = document.getElementById('adultBtn');
    var genreActiveBtn = document.getElementById('genreActiveBtn');

    // Carga de datos ultra-compatible
    var xhr = new XMLHttpRequest();
    xhr.open('GET', JSON_URL, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200 || xhr.status === 0) {
                try {
                    var rawText = xhr.responseText;
                    // Limpieza de posibles bytes de orden de bomba (BOM)
                    rawText = rawText.replace(/^\uFEFF/, '');
                    
                    var data;
                    if (window.JSON && window.JSON.parse) {
                        data = JSON.parse(rawText);
                    } else {
                        data = eval('(' + rawText + ')');
                    }
                    
                    allThemes = [];
                    for (var i = 0; i < data.length; i++) {
                        var item = data[i];
                        allThemes.push({
                            archivo: item.archivo,
                            descarga: item.descarga,
                            genero: item.genero || 'Otro',
                            nombre: item.archivo.replace(/\.p3t$/i, ''),
                            preview_idx: (item.preview_idx !== undefined) ? item.preview_idx : 0
                        });
                    }
                    aplicarFiltros();
                } catch (e) {
                    grid.innerHTML = '<div style="color:red;">Error al procesar JSON. Revisa el formato.</div>';
                }
            }
        }
    };
    xhr.send();

    function intentarSiguienteCarpeta(imgElement, currentIndex, imgName) {
        var nextIndex = currentIndex + 1;
        if (nextIndex < PREVIEW_FOLDERS.length) {
            imgElement.src = PREVIEW_FOLDERS[nextIndex] + imgName;
            imgElement.onerror = function() { intentarSiguienteCarpeta(imgElement, nextIndex, imgName); };
        } else {
            imgElement.style.display = 'none';
        }
    }

    window.toggleAdulto = function() {
        mostrarContenidoAdulto = !mostrarContenidoAdulto;
        adultBtn.innerHTML = mostrarContenidoAdulto ? "+18 ON" : "+18 OFF";
        adultBtn.className = mostrarContenidoAdulto ? "sort-btn btn-adult active" : "sort-btn btn-adult";
        aplicarFiltros();
    };

    function aplicarFiltros() {
        var search = searchInput.value.toLowerCase();
        filteredThemes = [];
        
        if (currentGenre !== '') {
            genreActiveBtn.innerHTML = currentGenre.toUpperCase() + " x";
            genreActiveBtn.style.display = 'inline-block';
        } else {
            genreActiveBtn.style.display = 'none';
        }

        for (var i = 0; i < allThemes.length; i++) {
            var tema = allThemes[i];
            var genLower = tema.genero.toLowerCase();

            // Filtro adulto
            var esTemaAdulto = false;
            for (var j = 0; j < PALABRAS_ADULTO.length; j++) {
                if (genLower.indexOf(PALABRAS_ADULTO[j]) !== -1) {
                    esTemaAdulto = true;
                    break;
                }
            }
            if (!mostrarContenidoAdulto && esTemaAdulto) continue;

            // Filtro búsqueda y género
            var matchBusqueda = tema.nombre.toLowerCase().indexOf(search) !== -1;
            var matchGenero = (currentGenre === '') || (genLower === currentGenre.toLowerCase());
            
            if (matchBusqueda && matchGenero) {
                filteredThemes.push(tema);
            }
        }

        if (currentSort === 'az') {
            filteredThemes.sort(function(a, b) { return a.nombre < b.nombre ? -1 : 1; });
        } else if (currentSort === 'za') {
            filteredThemes.sort(function(a, b) { return a.nombre > b.nombre ? -1 : 1; });
        }
        
        currentPage = 0;
        render(true);
    }

    function render(reset) {
        if (reset) grid.innerHTML = '';
        var start = currentPage * PAGE_SIZE;
        var end = (start + PAGE_SIZE > filteredThemes.length) ? filteredThemes.length : start + PAGE_SIZE;
        var html = '';

        for (var i = start; i < end; i++) {
            var t = filteredThemes[i];
            var img = encodeURI(t.nombre + '.png').replace(/'/g, "%27").replace(/&/g, "%26");
            var startIdx = t.preview_idx;
            var folderBase = PREVIEW_FOLDERS[startIdx] || PREVIEW_FOLDERS[0];
            var nombreLimpio = t.nombre.replace(/\(nombre igual\)/gi, "").replace(/pkg/gi, "");

            html += '<div class="theme-card">' +
                        '<div class="preview">' +
                            '<img src="' + folderBase + img + '" ' +
                            'onerror="intentarSiguienteCarpeta(this, ' + startIdx + ', \'' + img + '\')">' +
                        '</div>' +
                        '<div class="card-info">' +
                            '<div class="theme-name">' + nombreLimpio + '</div>' +
                            '<div class="theme-genre" onclick="filtrarPorGenero(\'' + t.genero + '\')">' + t.genero + '</div>' +
                            '<a href="' + t.descarga + '" class="download-btn">Descargar</a>' +
                        '</div>' +
                    '</div>';
        }

        if (reset) grid.innerHTML = html; else grid.innerHTML += html;
        statsDiv.innerHTML = filteredThemes.length + ' temas';
        loadMoreContainer.style.display = (end < filteredThemes.length) ? 'block' : 'none';
    }

    window.filtrarPorGenero = function(g) { currentGenre = g; searchInput.value = ''; aplicarFiltros(); };
    window.volverInicio = function() { searchInput.value = ''; currentGenre = ''; currentSort = 'none'; aplicarFiltros(); };
    window.buscarTemas = function() { currentGenre = ''; aplicarFiltros(); };
    window.cargarMas = function() { currentPage++; render(false); };
    window.ordenarAZ = function() { currentSort = 'az'; aplicarFiltros(); };
    window.ordenarZA = function() { currentSort = 'za'; aplicarFiltros(); };
    window.modoAleatorio = function() {
        filteredThemes.sort(function() { return 0.5 - Math.random(); });
        currentPage = 0;
        render(true);
    };
</script>
</body>
</html>
